function fbStatusText(f,status){ const e=P(f.pid); if(!textable(e)) return; const l=e.lang; const h=first(P(f.handler).name); const o={kind:'fbstatus',ctx:{type:'feedback',id:f.id,ref:f.ref},restricted:!!f.restricted};
  if(status==='working') sendText(e.id,LL(l,`${ORGN()}: ${h} is working on case ${f.ref}. Next update by ${shortDate(f.nextBy,l)}.`,`${ORGN()}: ${h} está trabajando en el caso ${f.ref}. Próxima respuesta a más tardar el ${shortDate(f.nextBy,l)}.`),o);
  if(status==='resolved'){ if(f.type==='positive'){ f.status='confirmed'; f.hist.push({day:S.day,k:'h_confirmed'}); sendText(e.id,LL(l,`${ORGN()}: Thanks again for sharing. Case ${f.ref} is closed.`,`${ORGN()}: Gracias otra vez por compartir. El caso ${f.ref} quedó cerrado.`),o); return; }
    sendText(e.id,LL(l,`${ORGN()}: ${h} marked case ${f.ref} resolved. Is it fixed? Reply 1 Yes or 2 Not yet for case ${f.ref}.`,`${ORGN()}: ${h} marcó el caso ${f.ref} como resuelto. ¿Quedó arreglado? Responde 1 Sí o 2 Todavía no para el caso ${f.ref}.`),o); addReq(e.id,'choice',{type:'feedback',id:f.id},f.ref,S.day+5); } }
const H_L={h_submitted:['{e} shared this','{e} lo compartió'],h_texted:['{e} texted this','{e} lo envió por mensaje'],h_logged:['{n} logged it as feedback','{n} lo registró como comentario'],h_working:['Marked “Working on it”','Marcado “En proceso”'],h_resolved:['Marked resolved — asked {e} to confirm','Marcado resuelto; se pidió confirmación a {e}'],h_escalated:['Owner stepped in','La dueña intervino'],h_reply:['{n} replied','{n} respondió'],h_confirmed:['{e} confirmed it’s fixed','{e} confirmó que quedó arreglado'],h_reopened:['{e} reopened it','{e} lo reabrió'],h_empmsg:['{e} added a message','{e} agregó un mensaje']};
function histL(h,e){ const x=H_L[h.k]; return x?X(x[0],x[1]).replace('{e}',first(e.name)).replace('{n}',h.name||''):h.k; }
function feedbackDetail(f){
  const e=P(f.pid); const own=isOwner(); const d=S.view.fbReply||(S.view.fbReply={tpl:null,text:'',next:2,status:f.status==='received'?'working':(fbOpen(f)?'working':f.status),tr:null});
  const qrs=f.type==='positive'?['qr4']:['qr1','qr2','qr3','qr4']; const outLang=e.lang;
  const msgs=S.msgs.filter(m=>m.ctx&&m.ctx.type==='feedback'&&m.ctx.id===f.id&&(m.dir==='in'||m.dir==='out')&&(m.kind!=='fbnew')&&msgVisible(m)).sort(byTime);
  const srcTxt=f.restricted?X('Private owner-only form (web)','Formulario privado solo para la dueña (web)'):f.via==='web'?X('Web form from a text link','Formulario web desde un enlace'):X('Text message, logged as feedback','Mensaje de texto registrado como comentario');
  const aboutTxt= f.restricted?X('Sent through “Contact the owner privately.” Only the owner can see it. Managers aren’t told and can’t open it.','Enviado por “Contactar a la dueña en privado”. Solo la dueña puede verlo. Los gerentes no reciben aviso ni pueden abrirlo.'):'';
  const can=textable(e);
  return `<div class="page"><button class="back" data-a="closeSub">${icon('left',14)} ${X('Feedback','Comentarios')}</button>
  ${fbOverdue(f)?`<div class="alert r" style="margin:6px 0 12px">${icon('alert')}<div class="grow"><b>${X('Reply is late.','Respuesta atrasada.')}</b> ${X('The next update was due ','La próxima respuesta vencía el ')}${fd(f.nextBy)}.</div></div>`:''}
  <div class="two"><div>
   <div class="row" style="margin-bottom:8px">${fbTypePill(f)}<h2 style="margin:0;font-size:20px">${topicL(f.topic)} · <span class="mono">${X('case','caso')} ${f.ref}</span></h2>${fbStatusPill(f)}</div>
   ${aboutTxt?`<div class="alert b" style="margin-bottom:10px">${icon('lock')}<div class="grow">${aboutTxt}</div></div>`:''}
   <div class="cvt-b" style="max-height:none;border:1px solid var(--line);border-radius:12px">
    ${msgs.length?msgs.map(m=>bubble(m,e)).join(''):`<div class="bub in"><div class="bh"><b>${esc(e.name)}</b><span>${fd(f.created)}</span></div><div class="bt">${esc(f.text.text)}</div></div>`}
   </div>
   ${fbOpen(f)?`<div class="card" style="margin-top:10px"><span class="label">${f.restricted?X('Reply privately to ','Responder en privado a '):X('Text ','Enviar mensaje a ')}${esc(first(e.name))} <span class="muted">(${X('reads ','lee en ')}${langName(outLang)})</span></span>
    ${f.restricted?`<p class="def" style="margin-top:0">${X('Your reply is posted to a secure page. Their text only says you replied, with a link.','Tu respuesta se publica en una página segura. El mensaje solo dice que respondiste, con un enlace.')}</p>`:''}
    ${!can&&!f.restricted?`<div class="alert r" style="margin-bottom:8px">${icon('lock')}<div class="grow">${X(`${first(e.name)} can’t receive texts (${exclL(eligibleFor(e))}). You can still update the status or talk in person.`,`${first(e.name)} no puede recibir mensajes (${exclL(eligibleFor(e))}). Puedes actualizar el estado o hablar en persona.`)}</div></div>`:''}
    <div class="chips" style="margin-bottom:8px">${qrs.map(k=>`<button class="chip ${d.tpl===k?'on':''}" data-a="frQuick" data-x="${k}">${esc(tl(S.lang,k,{date:fd(S.day+d.next)}).slice(0,44))}…</button>`).join('')}</div>
    ${d.tpl?`<div class="trbox"><div class="small" lang="${S.lang}"><b>${langName(S.lang)}</b><br>${esc(tl(S.lang,d.tpl,{date:fd(S.day+d.next,S.lang)}))}</div>${outLang!==S.lang?`<div class="small" lang="${outLang}"><b>${langName(outLang)}</b><br>${esc(tl(outLang,d.tpl,{date:fd(S.day+d.next,outLang)}))}</div>`:''}</div><button class="btn link small" data-a="frQuick" data-x="">${X('Write my own','Escribir la mía')}</button>`:
    `<textarea class="in" rows="3" data-bind="view.fbReply.text" data-live="frText" placeholder="${X('Write a reply','Escribe una respuesta')}" lang="${S.lang}" aria-label="${X('Reply','Respuesta')}">${esc(d.text)}</textarea>
     ${outLang!==S.lang&&d.text.trim()?(d.trErr?`<div class="alert r" style="margin-top:8px">${icon('alert')}<div class="grow">${X('Translation failed. Nothing will be sent until there’s a reviewed translation.','La traducción falló. No se enviará nada hasta tener una traducción revisada.')}</div><button class="btn sm" data-a="frTranslate">${X('Retry','Reintentar')}</button></div>`:d.tr!=null?`<div style="margin-top:8px"><div class="tl2" style="font-size:12px;font-weight:700;color:var(--muted)">${langName(outLang)} ${sim(X('SIMULATED TRANSLATION','TRADUCCIÓN SIMULADA'))}</div><textarea class="in" rows="2" data-bind="view.fbReply.tr" lang="${outLang}" aria-label="${X('Translation','Traducción')}">${esc(d.tr)}</textarea>${d.trQ==='rough'?`<div class="def" style="color:var(--amber)">${X('Rough draft — please check it.','Borrador aproximado: revísalo.')}</div>`:''}</div>`:`<button class="btn sm" style="margin-top:8px" data-a="frTranslate">${icon('globe',14)} ${X('Translate to ','Traducir al ')}${langName(outLang)}</button>`):''}`}
    <div class="row" style="margin-top:10px"><label class="small">${X('Next update by','Próxima respuesta')} <select class="in" style="width:auto;min-height:34px;padding:4px 8px" data-bind="view.fbReply.next" data-num="1" data-rerender="1">${[1,2,3,5].map(n=>`<option value="${n}" ${d.next===n?'selected':''}>${fd(S.day+n)}</option>`).join('')}</select></label>
    <label class="small">${X('Status','Estado')} <select class="in" style="width:auto;min-height:34px;padding:4px 8px" data-bind="view.fbReply.status">${[['working',X('Working on it','En proceso')],['resolved',X('Resolved — ask them to confirm','Resuelto: pedir confirmación')]].map(([k,l])=>`<option value="${k}" ${d.status===k?'selected':''}>${l}</option>`).join('')}</select></label>
    <button class="btn p right" data-a="frSend" data-x="${f.id}">${f.restricted?X('Post private reply','Publicar respuesta privada'):X('Send text','Enviar mensaje')}</button></div>${d.err?`<div class="inline-err">${X('Pick a quick reply, write a message, or change the status. If they read another language, translate it first.','Elige una respuesta, escribe un mensaje o cambia el estado. Si lee otro idioma, tradúcelo primero.')}</div>`:''}
    <p class="def" style="margin-bottom:0">${X('Status changes are texted too. Resolving asks them “Is it fixed? Reply 1 Yes, 2 Not yet.” Replies sent from email never change the status.','Los cambios de estado también se envían. Al resolver se pregunta “¿Quedó arreglado? Responde 1 Sí, 2 Todavía no.” Las respuestas por correo nunca cambian el estado.')}</p></div>`:
    f.status==='resolved'?`<div class="alert b" style="margin-top:10px">${icon('clock')}<div class="grow">${X(`Waiting for ${first(e.name)} to reply 1 (fixed) or 2 (not yet).`,`Esperando que ${first(e.name)} responda 1 (arreglado) o 2 (todavía no).`)}</div></div>`:`<div class="okbar" style="margin-top:10px">${icon('check')} ${X(`Closed${f.type==='positive'?'':` — ${first(e.name)} confirmed it’s fixed`}.`,`Cerrado${f.type==='positive'?'':`: ${first(e.name)} confirmó que quedó arreglado`}.`)}</div>`}
   ${!fbOpen(f)&&f.type!=='positive'&&!f.restricted?`<button class="btn" style="margin-top:10px" data-a="newWin" data-x="${f.id}">${icon('mega',14)} ${X('Share as “You said, we did”','Compartir como “Dijeron / hicimos”')}</button>`:''}
  </div>
  <div><div class="card"><h3>${X('Details','Detalles')}</h3><dl class="kv"><dt>${X('From','De')}</dt><dd>${esc(e.name)} · ${roleL(e.role)}</dd><dt>${X('Location','Tienda')}</dt><dd>${esc(L(f.loc).name)}</dd><dt>${X('Came in by','Llegó por')}</dt><dd>${srcTxt}</dd><dt>${X('Handled by','Lo atiende')}</dt><dd>${esc(P(f.handler).name)}</dd><dt>${X('Next update by','Próxima respuesta')}</dt><dd>${fbOpen(f)?fd(f.nextBy):'—'}</dd><dt>${X('Visible to','Visible para')}</dt><dd>${f.restricted||S.org.kind==='single'?esc(OWNER().name)+(!f.restricted&&S.org.kind==='single'?X(' and managers',' y gerentes'):''):esc(P(f.handler).name)+X(', other managers here, and ',', otros gerentes de la tienda y ')+esc(OWNER().name)}</dd><dt>${X('Anonymous?','¿Anónimo?')}</dt><dd>${X('No — named. Texts are never anonymous.','No: con nombre. Los mensajes nunca son anónimos.')}</dd></dl>
   <div class="row" style="margin-top:12px">${fbOpen(f)&&!own&&!f.escalated?`<button class="btn sm" data-a="fbEscalate" data-x="${f.id}">${icon('flag',14)} ${X('Escalate to owner','Escalar a la dueña')}</button>`:''}${fbOpen(f)&&own&&f.handler!==S.org.owner?`<button class="btn sm" data-a="fbTakeover" data-x="${f.id}">${X('Take over','Tomar el caso')}</button>`:''}<button class="btn sm" data-a="openCv" data-x="${e.id}">${icon('chat',14)} ${X('Conversation','Conversación')}</button></div>
   <p class="def" style="margin-bottom:0">${icon('lock',12)} ${X('Never used for rewards, goals, or performance.','Nunca se usa para recompensas, metas ni desempeño.')}</p></div>
   <div class="card" style="margin-top:12px"><h3>${X('History','Historial')}</h3><div class="tl">${f.hist.map(h=>`<div><span class="mono">${fd(h.day,null,{month:'short',day:'numeric'})}</span> · ${esc(histL(h,e))}</div>`).join('')}</div></div></div></div></div>`;
}


/* ============ Rewards & budget ============ */
function rewardsPage(){
  const locs=scope(); const own=isOwner(); const me=P(actorId());
  const aps=S.approvals.filter(a=>locs.includes(a.loc)&&(own||S.recogs.find(r=>r.id===a.rid).from===me.id));
  const red=S.ledger.filter(l=>l.kind==='redeem'&&locs.includes(l.loc)).sort((a,b)=>b.day-a.day);
  const recent=S.recogs.filter(r=>locs.includes(r.loc)).sort((a,b)=>b.day-a.day).slice(0,8);
  const fsLabel={ok:stp('done',X('Funded','Con fondos')),low:stp('prog',X('Low balance','Saldo bajo')),empty:stp('need',X('No funds','Sin fondos'))};
  return `<div class="page">${backToMore()}<div class="page-h"><div><h1>${X('Rewards & budget','Recompensas y presupuesto')}</h1><div class="sub">${X(`One monthly budget per location · resets ${fd(nextReset(),null,{month:'short',day:'numeric'})} · unused budget doesn’t roll over; earned rewards stay with employees`,`Un presupuesto mensual por tienda · se reinicia el ${fd(nextReset(),null,{month:'short',day:'numeric'})} · lo no usado no se acumula; lo ganado se queda con cada persona`)}</div></div></div>
  ${locs.map(id=>{ const l=L(id); const sp=spentLoc(id), rs=reservedLoc(id), av=availLoc(id), is=issuedLoc(id), fs=fundState(id);
    return `<div class="card" style="margin-bottom:14px"><div class="row between"><h3 style="margin:0">${esc(l.name)} · ${monthName(S.day)}</h3><div class="row">${l.budget?fsLabel[fs]:''}${own?`<button class="btn sm" data-a="editBudget" data-x="${id}">${X('Change budget','Cambiar presupuesto')}</button><button class="btn sm" data-a="openFunds" data-x="${id}">${X('Add funds','Agregar fondos')}</button>`:''}</div></div>
     ${l.budget?`<div class="funnel" style="grid-template-columns:repeat(5,minmax(0,1fr));margin-top:12px">
      <div><small>${X('Monthly budget','Presupuesto mensual')}</small><b>${$(l.budget)}</b></div>
      <div><small>${X('Earned by employees','Ganado por empleados')}</small><b>${$(sp)}</b></div>
      <div><small>${X('Reserved for goals','Reservado para metas')}</small><b>${$(rs)}</b></div>
      <div><small>${X('Available','Disponible')}</small><b style="${av<0?'color:var(--red)':''}">${$(av)}</b></div>
      <div><small>${X('Issued (cards sent)','Entregado (tarjetas)')}</small><b>${$(is)}</b></div></div>
      <div class="meter" style="margin:12px 0 6px;height:12px"><i style="width:${Math.min(100,sp/l.budget*100)}%;background:var(--purple)"></i><i style="width:${Math.min(100,rs/l.budget*100)}%;background:#cbbdf6"></i></div>
      <div class="def">${X('Budget is a spending limit. Funding is the money loaded to pay rewards: ','El presupuesto es un límite de gasto. Los fondos son el dinero cargado para pagar: ')}<b>${$(l.funded)}</b> ${X('funded','con fondos')} · ${$(owedLoc(id))} ${X('earned but not yet issued','ganado aún sin entregar')} ${sim()}</div>
      ${S.people.filter(p=>p.perm==='manager'&&p.mgrLocs.includes(id)).map(m=>`<div class="def" style="margin-top:4px">${esc(m.name)}: ${$(mgrSpent(m.id))} ${X('of','de')} ${$(m.limit)} ${X('manager limit used','del límite de gerente')}</div>`).join('')}`
     :`<p class="def" style="margin:8px 0 0">${X('No reward budget. Recognition still works without money.','Sin presupuesto. El reconocimiento funciona sin dinero.')}</p>${own?`<button class="btn sm" style="margin-top:8px" data-a="editBudget" data-x="${id}">${X('Set a budget','Definir presupuesto')}</button>`:''}`}</div>`; }).join('')}
  <div class="grid g2"><div class="card"><h3>${X('Approvals','Aprobaciones')}</h3>${aps.length?aps.map(a=>{ const r=S.recogs.find(x=>x.id===a.rid); return `<div class="item"><div class="grow"><div class="t">${$(a.amt)} · ${esc(P(r.to).name)}</div><div class="small muted">${esc(P(r.from).name)} · ${reasonL(r.reason)} · ${fd(r.day)}</div></div>${a.status==='open'?(own?`<button class="btn sm p" data-a="openApproval" data-x="${a.id}">${X('Review','Revisar')}</button>`:stp('prog',X('With owner','Con la dueña'))):a.status==='approved'?stp('done',X('Approved','Aprobada')):stp('mute',X('Declined','Rechazada'))}</div>`; }).join(''):`<div class="def">${X('No approvals.','Sin aprobaciones.')}</div>`}</div>
   <div class="card"><h3>${X('Redemptions','Canjes')}</h3>${red.length?red.slice(0,8).map(l=>`<div class="item"><div class="grow"><div class="t">${$(l.amt)} · ${esc(P(l.pid).name)}</div><div class="small muted">${l.opt.type==='meal'?X('Meal credit','Crédito de comida')+' · '+esc(l.opt.code||''):esc(l.opt.brand||'')} · ${fd(l.day)}${l.why?' · '+esc(l.why):''}</div></div>${({issued:stp('done',X('Issued','Entregado')),pending:stp('prog',X('Processing','Procesando')),failed:stp('need',X('Failed','Falló')),waiting:stp('info',X('Waiting for manager','Espera gerente')),funding:stp('need',X('Needs funds','Faltan fondos'))})[l.status]}${l.status==='waiting'?`<button class="btn sm p" data-a="confirmMeal" data-x="${l.id}">${X('Confirm','Confirmar')}</button>`:''}</div>`).join(''):`<div class="def">${X('No redemptions yet.','Aún no hay canjes.')}</div>`}
    <p class="def">${X('Meal credits: the employee shows a code; the manager on shift confirms it here once the meal is rung up.','Créditos de comida: la persona muestra un código y el gerente en turno lo confirma aquí al registrar la comida.')}</p></div></div>
  <div class="card" style="margin-top:14px"><h3>${X('Recent recognition','Reconocimientos recientes')}</h3>${recent.map(r=>`<div class="item"><span class="av" style="background:var(--greenL);color:var(--green)">${icon(r.kind==='peer'?'heart':'star',14)}</span><div class="grow"><div class="t">${esc(P(r.from).name)} → ${esc(P(r.to).name)} ${r.kind==='peer'?stp('mute',X('Peer thanks','Agradecimiento')):''} ${r.vis==='team'?stp('info',X('Team','Equipo')):stp('mute',X('Private','Privado'))}</div><div class="small muted">${reasonL(r.reason)} · ${fd(r.day)}${r.amt?' · '+$(r.amt)+' '+(r.reward==='approved'?X('reward earned','recompensa ganada'):r.reward==='pending'?X('awaiting approval','esperando aprobación'):X('reward declined','recompensa rechazada')):''}</div></div>${r.vis==='team'?`<button class="btn sm" data-a="hideRecog" data-x="${r.id}">${r.hidden?X('Show','Mostrar'):X('Hide from team','Ocultar al equipo')}</button>`:''}</div>`).join('')||`<div class="def">${X('None yet.','Aún no hay.')}</div>`}</div></div>`;
}

/* ============ Team goals ============ */
function goalsPage(){
  if(S.gw) return goalWizard();
  if(S.view.sub){ const g=S.goals.find(x=>x.id===S.view.sub); if(g) return goalDetail(g); }
  const locs=scope();
  return `<div class="page">${backToMore()}<div class="page-h"><div><h1>${X('Team goals','Metas del equipo')}</h1><div class="sub">${X('One active goal per location. Keep it simple and clear.','Una meta activa por tienda. Simple y clara.')}</div></div></div>
  ${locs.map(id=>{ const g=S.goals.find(x=>x.loc===id&&x.status==='active'); const past=S.goals.filter(x=>x.loc===id&&x.status!=='active');
    return `<div class="card" style="margin-bottom:12px"><div class="row between"><h3 style="margin:0">${esc(L(id).name)}</h3>${g?`<button class="btn sm" data-a="openGoal" data-x="${g.id}">${X('Open','Abrir')}</button>`:`<button class="btn sm p" data-a="goalNew" data-x="${id}">${icon('plus',14)} ${X('Set up a goal','Crear meta')}</button>`}</div>
     ${g?`<div class="row" style="margin-top:8px;gap:14px"><b>${goalTitle(g)}</b>${stp('prog',X('Active','Activa'))}<span class="def">${Object.keys(g.done).length}/${g.eligible.length} ${X('goal reached','lograron la meta')} · ${$(g.reward)} ${X('each','c/u')} · ${X('ends ','termina ')}${fd(g.end)}</span></div>`:`<p class="def" style="margin:6px 0 0">${X('No active goal.','Sin meta activa.')}${past.length?' '+X(`${past.length} past goal(s).`,`${past.length} meta(s) anterior(es).`):''}</p>`}</div>`; }).join('')}</div>`;
}
function goalWizard(){
  const w=S.gw; const steps=[X('Choose goal','Elegir meta'),X('Team & reward','Equipo y recompensa'),X('Review & launch','Revisar y lanzar')];
  const tc=S.org.integrations.timeclock.connected; const tpl=GOAL_TPL[w.tpl];
  let h=`<div class="page"><button class="back" data-a="gwCancel">${icon('left',14)} ${X('Team goals','Metas del equipo')}</button><div class="page-h"><div><h1>${X('New team goal','Nueva meta del equipo')}</h1><div class="sub">${esc(L(w.loc).name)}</div></div></div><div class="steps">${steps.map((s,i)=>`<span class="step ${w.step===i+1?'on':w.step>i+1?'ok':''}"><b>${w.step>i+1?icon('check',12):i+1}</b>${s}</span>`).join('')}</div><div class="card">`;
  const team=crew([w.loc]).filter(p=>p.status!=='deactivated');
  const shifts=pid=>{ let n=0; for(let d=S.day; d<S.day+w.days; d++) if(worksOnS(pid,d)) n++; return n; };
  if(w.step===1){
    h+=`<div class="grid g2">${Object.entries(GOAL_TPL).map(([k,g])=>{ const dis=g.method==='auto'&&!tc; return `<button class="opt-card ${w.tpl===k?'on':''}" data-a="gwSet" data-x="tpl|${k}" ${dis?'disabled':''}><div class="row between"><b>${S.lang==='es'?g.es:g.en}</b>${g.method==='auto'?stp('info',X('Automatic','Automática')):stp('mute',X('Manager confirms','Confirma el gerente'))}</div><p class="small" style="margin:6px 0 0">${S.lang==='es'?g.dEs:g.dEn}</p>${dis?`<div class="def" style="margin-top:6px">${X('Needs schedule + timeclock. Optional — connect in Settings.','Requiere horario y reloj checador. Opcional: conéctalo en Configuración.')}</div>`:''}</button>`; }).join('')}</div>`;
  } else if(w.step===2){
    const auto=tpl.method==='auto';

function matchChip(m){ const h=m.matched; if(!h||m.dir!=='in') return ''; const ref=m.ctx&&m.ctx.ref;

  else if(h.what==='stop'){ t=X('Opt-out keyword — routine texts stopped','Palabra de baja: se detuvieron los mensajes'); tone='need'; }

function page(){ const pg=S.view.page; return ({today:todayPage,messages:messagesPage,team:teamPage,more:morePage,updates:updatesPage,feedback:feedbackPage,goals:goalsPage,rewards:rewardsPage,reports:reportsPage,settings:settingsPage,notify:notifyPage,auto:automationsPage})[pg]?.()||todayPage(); }
function render(){
  const v=S.demo.view;
  document.body.classList.toggle('mgmt',v==='dash');
  document.body.classList.toggle('guided',!!(S.demo.journey&&S.demo.guide&&!S.demo.guideMin));
  document.documentElement.lang=S.lang;
  let main;
  if(v==='phone') main=phoneView(); else if(v==='email') main=emailView(); else if(v==='browser') main=browserView();
  else if(!S.org.setupDone) main=isOwner()?`<main class="wrap">${onboarding()}</main>`:`<main class="wrap"><div class="empty">${X('No managers yet. Finish setup as the owner first.','Aún no hay gerentes. Termina la configuración como dueña.')}</div></main>`;
  else main=mgmtNav()+`<main class="wrap">${page()}</main>`;
  document.getElementById('app').innerHTML=header()+demoBar()+main;
  document.getElementById('overlay').innerHTML=drawerHtml()+modalHtml()+demoPanel()+guidePanel();
  const pb=document.getElementById('phbody'); if(pb) pb.scrollTop=pb.scrollHeight;
  const th=document.getElementById('thread'); if(th) th.scrollTop=th.scrollHeight;
  if(UI.focus){ const el=document.getElementById(UI.focus); if(el){ el.focus(); try{ el.setSelectionRange(el.value.length,el.value.length); }catch(e){} } UI.focus=null; }
  save();
}
function getPath(path){ return path.split('.').reduce((o,k)=>o==null?undefined:o[k],S); }
function setPath(path,val){ const p=path.split('.'); let o=S; for(let i=0;i<p.length-1;i++){ if(o[p[i]]==null) o[p[i]]={}; o=o[p[i]]; } o[p[p.length-1]]=val; }

function genCode(){ return String(100000+Math.floor(Math.random()*899999)); }
function fulfill(l){ setTimeout(()=>{ const x=S.ledger.find(y=>y.id===l.id); if(!x||x.status!=='pending') return;
  if(S.demo.giftFail){ x.status='failed'; x.why=X('Delivery failed — gift card provider timed out','Falló la entrega: el proveedor no respondió'); S.demo.giftFail=false; notify(x.pid,{type:'failed'}); }
  else { const loc=L(x.loc); if(loc.funded<x.amt){ x.status='funding'; } else { x.status='issued'; loc.funded-=x.amt; x.day=S.day; notify(x.pid,{type:'issued',amt:x.amt,brand:x.opt.brand,dest:x.opt.dest}); } }
  render(); },1500); }
function sendReminder(u){ u.reminders=1; let n=0; Object.entries(u.rec).forEach(([pid,r])=>{ const m=msgById(r.msg); const p=P(pid); if(r.ack||!m||!['delivered','unknown'].includes(m.st)||!textable(p)) return; n++; r.reminded=true; const tx=uText(u,p.lang);
    sendText(pid,LL(p.lang,`${headFor(p)}: Reminder – please reply ACK ${u.ref} to confirm “${trunc(tx.t,50)}”.`,`${headFor(p)}: Recordatorio – responde ACK ${u.ref} para confirmar “${trunc(tx.t,50)}”.`),{kind:'update',author:u.author,ctx:{type:'update',id:u.id,ref:u.ref}}); }); return n; }
function advanceDay(){
  S.day++; S.t=7*60;
  staffList().forEach(s=>{ if(S.prefs[s.id]&&S.prefs[s.id].daily) mkDigest(s.id); });
  S.t=9*60; runAutomations();
  S.updates.filter(u=>u.status==='scheduled'&&u.schedDay<=S.day).forEach(u=>{ u.status='sent'; u.sentDay=S.day; deliver(u); });
  S._seeding=true;
  S.updates.filter(u=>u.status==='sent'&&uActive(u)&&u.mode==='important').forEach(u=>{ Object.entries(u.rec).forEach(([pid,r],i)=>{ if(pid===S.demo.emp||r.ack) return; const m=msgById(r.msg); if(!m||m.st==='failed') return; if(hsh(u.id+pid+S.day)<.45){ S.t=9*60+5+i; receiveText(pid,P(pid).lang==='es'?'ACK '+u.ref:'ack '+u.ref); } }); });
  S._seeding=false; S.t=9*60+30;
  S.updates.filter(u=>u.mode==='important'&&u.remindPlan&&u.reminders===0&&u.status==='sent'&&uActive(u)&&S.day>=u.sentDay+1).forEach(sendReminder);
  S.goals.filter(g=>g.status==='active'&&g.method==='auto').forEach(g=>{ g.eligible.forEach(pid=>{ const before=goalProgress(g,pid).n;
      (g.shifts[pid]||[]).filter(s=>s.day===S.day-1&&s.st==='upcoming').forEach(s=>{ s.st=S.demo.tcDelay?'pending_data':(pid===S.demo.emp&&hsh(pid+s.day)<.3?'late':(hsh(pid+'x'+s.day)<.88?'on_time':'late')); });

  if(b==='__fund'){ UI.fundAmt=v; return; } if(b==='__bud'){ UI.budAmt=v; return; }
  if(b.startsWith('__rev.')){ const m=msgById(b.slice(6)); if(m&&m.tr) m.tr.text=v; return; }
  setPath(b,v); }
document.addEventListener('input',ev=>{ const el=ev.target; if(!el.dataset||!el.dataset.bind||el.tagName==='SELECT') return; bindVal(el);
  const live=el.dataset.live; const b=el.dataset.bind;

  if(live==='recogNote'&&S.drawer){ S.drawer.f.tr=null; S.drawer.f.trErr=false; }
  if(live==='frText'&&S.view.fbReply){ S.view.fbReply.tr=null; S.view.fbReply.trErr=false; }
  if(live==='comp'&&S.comp&&(b==='comp.t'||b==='comp.b')) S.comp.tr=null;
  if(live==='cmp'&&/\.text$/.test(b)){ const pid=b.split('.')[2]; const d=cmpOf(pid); if(!d.trManual){ d.tr=null; d.trErr=false; } }
  if(live&&live!=='trEdit'){ const sel=`[data-bind="${b}"]`; const pos=el.selectionStart; render(); const n=document.querySelector(sel); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} } } else save(); });
document.addEventListener('change',ev=>{ const el=ev.target;

  const c=el.dataset.c; if(!c) return; const v=el.type==='checkbox'?el.checked:el.value;

function autoInit(scn){ return {touch:{on:true,days:[3,14,30,60,90,180],log:[]},stay:{on:scn!=='new',freq:30,anon:true,next:7,qi:0,sent:[]},celebrate:{on:scn!=='new',bday:true,anniv:true,reward:0,log:[]},exit:{on:scn!=='new',delay:1,involuntary:false,queue:[],log:[],responses:[]}}; }
function yrsAgo(y,plus){ return Math.round((new Date(2026-y,8,24+plus)-BASE)/864e5); }
function seedDates(st){ const H={e1:-3,e2:-14,e3:-400,e4:-30,e5:-260,e6:-520,e7:-5,e8:yrsAgo(3,1),e9:-89,e10:-150,'c-mia':-3,'c-carlos':yrsAgo(2,1),'c-emily':-200,'c-jas':-75,'c-luis':-410,'c-andrea':-59,'c-rosa':-2,'c-noah':-6,'c-diego':-700};
  const B={e5:'09-24',e6:'09-25',e3:'11-02',e8:'03-14','c-emily':'09-25','c-luis':'09-24'};
  st.people.forEach(p=>{ if(p.perm==='owner') return; p.hireDay=H[p.id]!=null?H[p.id]:-(120+Math.floor(hsh(p.id+'h')*900)); p.bday=B[p.id]||null; }); }
function md(day){ const d=dateOf(day); return String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function annivYears(p,day){ if(p.hireDay==null||p.hireDay>=day) return 0; const a=dateOf(p.hireDay), b=dateOf(day); if(a.getMonth()!==b.getMonth()||a.getDate()!==b.getDate()) return 0; return b.getFullYear()-a.getFullYear(); }
function fmtMD(s,lang){ if(!s) return ''; const [m,d]=s.split('-').map(Number); return new Date(2026,m-1,d).toLocaleDateString((lang||S.lang)==='es'?'es-US':'en-US',{month:'short',day:'numeric'}); }

function touchDue(day,locs){ const out=[]; if(!S.auto.touch.on) return out; crew(locs||LOCS().map(l=>l.id)).forEach(p=>{ if(p.hireDay==null) return; S.auto.touch.days.forEach(n=>{ if(p.hireDay+n===day&&!S.auto.touch.log.some(t=>t.pid===p.id&&t.n===n)) out.push({p,n}); }); }); return out; }

     <div class="row" style="margin-top:10px">${own?`<button class="btn sm" data-a="autoStayNow">${icon('mega',13)} ${X('Send the next one now','Enviar la próxima ahora')} ${sim('DEMO')}</button>`:''}<button class="btn sm" data-a="goPulse">${X('See results in Check-ins','Ver resultados en Preguntas')}</button></div>
     <p class="def" style="margin-bottom:0">${X('For one-off announcements to everyone, use Updates — they text everyone at once, privately.','Para anuncios a todos, usa Avisos: se envían a todos a la vez, en privado.')}</p>`);
  const cl=a.celebrate.log.filter(x=>pids.has(x.pid)).sort((x,y)=>y.day-x.day);
  h+=sec('celebrate','star',X('Birthdays & work anniversaries','Cumpleaños y aniversarios'),a.celebrate.on,X('A short, personal text on the day. Birthdays only go to people who shared theirs on their own page; anniversaries use the hire date.','Un mensaje corto y personal ese día. Los cumpleaños solo se envían a quien compartió el suyo en su página; los aniversarios usan la fecha de ingreso.'),
    `<div class="row" style="margin-bottom:12px"><label class="chk"><input type="checkbox" data-c="autoBday" ${a.celebrate.bday?'checked':''} ${own?'':'disabled'}> ${X('Birthdays','Cumpleaños')}</label><label class="chk"><input type="checkbox" data-c="autoAnniv" ${a.celebrate.anniv?'checked':''} ${own?'':'disabled'}> ${X('Work anniversaries','Aniversarios laborales')}</label>
      <label class="small row" style="gap:6px">${X('Anniversary thank-you','Agradecimiento por aniversario')} <select class="in" style="width:auto;min-height:34px;padding:4px 8px" data-c="autoReward" ${own?'':'disabled'}>${[0,5,10,20].map(n=>`<option value="${n}" ${a.celebrate.reward===n?'selected':''}>${n?$(n)+X(' reward',' en recompensa'):X('No money','Sin dinero')}</option>`).join('')}</select></label></div>
     ${a.celebrate.reward?`<p class="def">${X('Counts against the location’s monthly budget. If the budget is short, the text still goes out without mentioning money.','Cuenta contra el presupuesto mensual de la tienda. Si no alcanza, el mensaje sale sin mencionar dinero.')}</p>`:''}
     <div class="smsp" style="margin-bottom:12px">${s1?autoPreview(celebSms(s1,'bday',0,null),X('Birthday','Cumpleaños')+' · English'):''}${s2&&s2.lang==='es'?autoPreview(celebSms(s2,'anniv',2,a.celebrate.reward?'r/XXXX':null),X('Anniversary','Aniversario')+' · Español'):''}</div>
     <p class="def">${X('Celebration texts are private to the person. Nothing is shared with the team, and dates of birth aren’t shown to coworkers. Emoji are left out because they switch a text to Unicode.','Los mensajes de celebración son privados. No se comparten con el equipo y las fechas de nacimiento no se muestran a compañeros. No se usan emojis porque cambian el mensaje a Unicode.')}</p>
     ${cl.length?`<div class="rows">${cl.slice(0,5).map(x=>`<div class="rowi"><div class="av">${initials(P(x.pid).name)}</div><div class="grow"><div class="nm">${esc(P(x.pid).name)} · ${x.kind==='bday'?X('Birthday','Cumpleaños'):X(`${x.yrs}-year anniversary`,`Aniversario de ${x.yrs} año(s)`)}</div><div class="mt">${fd(x.day)}${x.rewarded?' · '+$(a.celebrate.reward)+X(' reward',' en recompensa'):''}${x.skipped?' · '+X('reward skipped: budget short','recompensa omitida: sin presupuesto'):''}</div></div>${dstPill((msgById(x.msg)||{}).st||'queued')}</div>`).join('')}</div>`:''}`);
  h+=sec('exit','logout',X('Exit surveys','Encuestas de salida'),a.exit.on,X('When you deactivate someone, Plum Crew can text them one short survey about why they left. It goes to the owner only, and it’s sent once — never a reminder.','Cuando desactivas a alguien, Plum Crew puede enviarle una encuesta corta sobre por qué se fue. Solo la ve la dueña y se envía una vez, sin recordatorios.'),
    `<div class="row" style="margin-bottom:12px"><label class="small row" style="gap:6px">${X('Send','Enviar')} <select class="in" style="width:auto;min-height:34px;padding:4px 8px" data-c="autoExitDelay" ${own?'':'disabled'}>${[0,1,3].map(n=>`<option value="${n}" ${a.exit.delay===n?'selected':''}>${n?X(`${n} day${n>1?'s':''} after`,`${n} día(s) después`):X('Right away','De inmediato')}</option>`).join('')}</select></label><label class="chk"><input type="checkbox" data-c="autoInvol" ${a.exit.involuntary?'checked':''} ${own?'':'disabled'}> ${X('Also after someone is let go','También después de un despido')}</label></div>
     <p class="def">${X('Eligible: people who agreed to texts and didn’t opt out. Their consent covers this one message; STOP still works.','Elegibles: personas que aceptaron mensajes y no se dieron de baja. Su consentimiento cubre este único mensaje; STOP sigue funcionando.')}</p>
     ${exq.length?`<div class="label">${X('Scheduled','Programadas')}</div><div class="rows" style="margin-bottom:12px">${exq.map(q=>`<div class="rowi"><div class="av">${initials(P(q.pid).name)}</div><div class="grow"><div class="nm">${esc(P(q.pid).name)}</div><div class="mt">${X(SEP_L[q.reason][0],SEP_L[q.reason][1])} · ${X('sends','se envía')} ${fd(q.due)} · 9:00 am</div></div>${own?`<button class="btn sm" data-a="autoExitNow" data-x="${q.pid}">${X('Send now','Enviar ahora')} ${sim('DEMO')}</button>`:''}</div>`).join('')}</div>`:''}
     <div class="grid g3" style="margin-bottom:10px"><div class="sumc"><div class="l">${X('Surveys sent','Encuestas enviadas')}</div><div class="v">${exSent}</div></div><div class="sumc"><div class="l">${X('Responses','Respuestas')}</div><div class="v">${exr.length}</div><div class="s">${exSent?Math.round(exr.length/exSent*100)+'%':'—'}</div></div><div class="sumc"><div class="l">${X('Would come back','Volverían')}</div><div class="v">${exr.filter(r=>r.again==='yes').length}</div><div class="s">${exr.filter(r=>r.again==='maybe').length} ${X('maybe','tal vez')}</div></div></div>
     ${showEx&&exr.length?`<div class="label">${X('Main reason for leaving','Motivo principal')}</div>${Object.keys(EXIT_R).filter(k=>rc(k)).map(k=>`<div class="bar-row" style="grid-template-columns:220px 1fr 40px"><span>${X(EXIT_R[k][0],EXIT_R[k][1])}</span><div class="meter"><i style="width:${rc(k)/exr.length*100}%;background:var(--purple)"></i></div><span class="mono">${rc(k)}</span></div>`).join('')}
       ${own?`<div class="label" style="margin-top:12px">${X('Responses (owner only)','Respuestas (solo la dueña)')}</div><div class="rows">${exr.slice().reverse().map(r=>`<div class="rowi"><div class="grow"><div class="nm">${esc(r.name)} · ${esc(L(r.loc).name)} · ${X(EXIT_R[r.reason][0],EXIT_R[r.reason][1])}</div><div class="mt">${fd(r.day)} · ${X('Come back','Volvería')}: ${({yes:X('Yes','Sí'),maybe:X('Maybe','Tal vez'),no:'No'})[r.again]}${r.comment?' · “'+esc(r.comment)+'”':''}</div></div></div>`).join('')}</div>`:`<p class="def">${X('Managers see totals only. Names and comments are visible to the owner.','Los gerentes solo ven totales. Nombres y comentarios los ve la dueña.')}</p>`}`
      :`<div class="def">${exr.length?X('Totals appear once there are at least 3 responses for your locations.','Los totales aparecen con al menos 3 respuestas en tus tiendas.'):X('No responses yet.','Aún no hay respuestas.')}</div>`}`);
  return h+'</div>';
}
/* ---- employee exit-survey page (link kind 'exit') ---- */
function bExit(L0,b,p){ const tok=L0.tok; const own=OWNER();
  if(L0.used||b.step==='done') return bBrand(p)+bMsg('check',XE('Thank you','Gracias'),XE(`Your answers went to ${esc(first(own.name))}. We wish you the best.`,`Tus respuestas se enviaron a ${esc(first(own.name))}. Te deseamos lo mejor.`));
  const f=b.ex||(b.ex={reason:null,again:null,comment:''});
  return bBrand(p)+`<h2>${XE('Why did you leave?','¿Por qué te fuiste?')}</h2><p class="lead">${XE('Two minutes. Your honest answer helps the next person.','Dos minutos. Tu respuesta sincera ayuda a la siguiente persona.')}</p>
   <div class="field"><span class="label">${XE('Main reason','Motivo principal')}</span>${Object.entries(EXIT_R).map(([k,v])=>`<button class="bigopt ${f.reason===k?'on':''}" style="min-height:48px;font-size:15px" data-a="bEx" data-x="${tok}|reason|${k}" aria-pressed="${f.reason===k}">${XE(v[0],v[1])}</button>`).join('')}</div>
   <div class="field"><span class="label">${XE('Would you consider working here again?','¿Volverías a trabajar aquí?')}</span><div class="pulsebtns">${[['yes',XE('Yes','Sí')],['maybe',XE('Maybe','Tal vez')],['no','No']].map(([k,l])=>`<button class="ebtn ${f.again===k?'p':''}" style="margin-top:0" data-a="bEx" data-x="${tok}|again|${k}" aria-pressed="${f.again===k}">${l}</button>`).join('')}</div></div>
   <div class="field"><label class="label" for="bexc">${XE('What could we have done better? (optional)','¿Qué pudimos hacer mejor? (opcional)')}</label><textarea id="bexc" class="in" rows="3" data-bind="bst.${tok}.ex.comment">${esc(f.comment)}</textarea></div>
   <div class="ecard" style="background:#fbf9ff;border-color:var(--purpleM)"><div class="k" style="color:var(--purpleD)"><span>${icon('eye',14)} ${tl(p.lang,'vis_title')}</span></div><p class="small" style="margin:0">${XE(`Only ${esc(own.name)} (owner). Your former manager won’t see your name or comments. This isn’t anonymous, and it won’t affect any final pay or references.`,`Solo ${esc(own.name)} (dueña). Tu exgerente no verá tu nombre ni tus comentarios. No es anónimo y no afecta tu último pago ni tus referencias.`)}</p></div>
   <button class="ebtn p" data-a="bExSend" data-x="${tok}" ${f.reason&&f.again?'':'disabled'}>${XE('Send','Enviar')}</button>`; }
Object.assign(A,{
  autoToggle(_,k){ if(!isOwner()) return false; const a=S.auto[k]; a.on=!a.on; toast(a.on?X('Turned on.','Activado.'):X('Turned off. Nothing more will be sent automatically.','Desactivado. No se enviará nada automáticamente.')); },
  autoTouchDay(_,n){ const d=S.auto.touch.days; n=+n; S.auto.touch.days=d.includes(n)?d.filter(x=>x!==n):d.concat(n).sort((a,b)=>a-b); },
  autoSet(_,x){ const [k,f,v]=x.split('|'); S.auto[k][f]=f==='anon'?v==='1':+v; },
  autoTouchNow(_,x){ const [pid,n]=x.split('|'); sendTouch(P(pid),+n); toast(X('Check-in texted.','Pregunta enviada.')); },
  autoCelebNow(_,x){ const [pid,k,y]=x.split('|'); sendCeleb(P(pid),k,+y); toast(X('Celebration texted.','Felicitación enviada.')); },
  autoStayNow(){ const pu=sendStay(); toast(pu.anon?X('Stay survey texted with private links.','Encuesta enviada con enlaces privados.'):X(`Stay survey ${pu.ref} texted.`,`Encuesta ${pu.ref} enviada.`)); },
  autoExitNow(_,pid){ const q=S.auto.exit.queue.find(x=>x.pid===pid&&!x.done); if(q){ q.due=S.day; sendExit(q); } const lg=S.auto.exit.log.slice(-1)[0]; toast(lg&&lg.status==='sent'?X('Exit survey texted.','Encuesta de salida enviada.'):X('Not sent: ','No enviada: ')+X(EXE_L[lg.why][0],EXE_L[lg.why][1])); },
  goAuto(_,x){ S.demo.view='dash'; S.view.page='auto'; S.view.sub=null; window.scrollTo(0,0); },
  bEx(_,x){ const [tok,k,v]=x.split('|'); const b=bstOf(tok); b.ex=b.ex||{comment:''}; b.ex[k]=v; },
  bExSend(_,tok){ const L0=bL(tok), p=P(L0.pid), b=bstOf(tok), f=b.ex; if(!f||!f.reason||!f.again) return; S.auto.exit.responses.push({pid:p.id,name:p.name,loc:p.locs[0],reason:f.reason,again:f.again,comment:(f.comment||'').trim(),day:S.day}); L0.used=true; b.step='done';
    const pr=S.prefs[S.org.owner]; if(pr&&(pr.immediate||pr.daily)) mkEmail(S.org.owner,'exitresp',{pid:p.id}); },
  deactivate(_,x){ const p=P(x); UI.sep={reason:'quit',survey:true};
    UI.modal=()=>{ const s=UI.sep; const why=isCrew(p)?exitEligible(p,s.reason):'notenrolled';
      return `<div class="panel-h"><span class="ico">${icon('alert')}</span><h2>${X(`Deactivate ${esc(p.name)}?`,`¿Desactivar a ${esc(p.name)}?`)}</h2></div><div class="panel-b"><p style="margin-top:0">${X('Texts to them stop and their open requests close. Rewards they already earned stay available to redeem for 90 days. You can reactivate them later.','Se detienen sus mensajes y se cierran sus solicitudes abiertas. Lo que ya ganó seguirá disponible para canjear por 90 días. Puedes reactivarlo después.')}</p>
       <div class="field"><label class="label" for="sepR">${X('Reason','Motivo')}</label><select id="sepR" class="in" data-c="sepReason">${Object.entries(SEP_L).map(([k,v])=>`<option value="${k}" ${s.reason===k?'selected':''}>${X(v[0],v[1])}</option>`).join('')}</select><div class="def">${X('Kept with their record. Not shared with the employee.','Se guarda en su registro. No se comparte con la persona.')}</div></div>
       ${why?`<div class="alert b">${icon('lock')}<div class="grow">${X('No exit survey: ','Sin encuesta de salida: ')}${EXE_L[why]?X(EXE_L[why][0],EXE_L[why][1]):exclL(why)}.</div></div>`:`<label class="chk" style="font-size:14px"><input type="checkbox" data-c="sepSurvey" ${s.survey?'checked':''}> ${X(`Text an exit survey ${S.auto.exit.delay?`in ${S.auto.exit.delay} day${S.auto.exit.delay>1?'s':''}`:'right away'} (one message, owner sees answers)`,`Enviar encuesta de salida ${S.auto.exit.delay?`en ${S.auto.exit.delay} día(s)`:'de inmediato'} (un mensaje; la dueña ve las respuestas)`)}</label>`}
       <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" data-a="modalClose">${X('Cancel','Cancelar')}</button><button class="btn p" style="background:var(--red);border-color:var(--red)" data-a="doDeactivate" data-x="${x}">${X('Deactivate','Desactivar')}</button></div></div>`; }; },
  doDeactivate(_,x){ const p=P(x); const s=UI.sep||{reason:'other',survey:false}; const why=isCrew(p)?exitEligible(p,s.reason):'notenrolled';
    p.status='deactivated'; p.sep={reason:s.reason,day:S.day}; S.reqs.filter(r=>r.pid===x).forEach(r=>r.active=false); S.goals.filter(g=>g.status==='active').forEach(g=>{ if(g.done[x]==null) g.eligible=g.eligible.filter(e=>e!==x); });
    let msg=X(`${first(p.name)} deactivated. Texts to them stopped.`,`${first(p.name)} desactivado. Se detuvieron sus mensajes.`);
    if(!why&&s.survey){ const q={pid:x,reason:s.reason,due:S.day+S.auto.exit.delay,done:false}; S.auto.exit.queue.push(q); if(q.due<=S.day){ sendExit(q); msg+=X(' Exit survey texted.',' Se envió la encuesta de salida.'); } else msg+=X(` Exit survey scheduled for ${fd(q.due)}.`,` Encuesta de salida programada para el ${fd(q.due)}.`); }
    UI.modal=null; S.drawer=null; toast(msg); },
});
Object.assign(A,{ bBday(_,x){ const [tok,mode]=x.split('|'); const p=P(bL(tok).pid), b=bstOf(tok); if(mode==='save'){ p.bday=(b.bm||'01')+'-'+(b.bd||'01'); toast(LL(p.lang,'Birthday saved.','Cumpleaños guardado.')); } else { p.bday=null; toast(LL(p.lang,'Birthday removed.','Cumpleaños eliminado.')); } } });
function touchOf(pid,n){ return S.auto.touch.log.filter(t=>t.pid===pid&&t.n===n).pop(); }

 {n:9,scn:'group',en:'New hire answers a check-in “not great”; manager follows up',es:'Una persona nueva responde “no” en su pregunta; el gerente da seguimiento',setup(){ S.demo.mgr='m1'; jSet('manager'); A.goAuto(); },

 {n:10,scn:'group',en:'Birthday and work anniversary texts go out automatically',es:'Los mensajes de cumpleaños y aniversario salen solos',setup(){ jSet('owner'); A.goAuto(); },

document.addEventListener('change',ev=>{ const el=ev.target; const c=el.dataset&&el.dataset.c; if(!c) return; const v=el.type==='checkbox'?el.checked:el.value; const a=S.auto; let hit=true;
  if(c==='autoBday') a.celebrate.bday=v; else if(c==='autoAnniv') a.celebrate.anniv=v; else if(c==='autoReward') a.celebrate.reward=+v; else if(c==='autoExitDelay') a.exit.delay=+v; else if(c==='autoInvol') a.exit.involuntary=v;
  else if(c==='sepReason'){ UI.sep.reason=v; } else if(c==='sepSurvey'){ UI.sep.survey=v; } else hit=false;
  if(hit) render(); });
/* ============ Start ============ */
try{ S=JSON.parse(sessionStorage.getItem(KEY)); }catch(e){ S=null; }
if(!S||S.v!=='v3sms'||!S.auto) S=seed('group');
S.msgs.filter(m=>m.st==='queued'||m.st==='sent').forEach(m=>setFinal(m));
S.ledger.filter(l=>l.kind==='redeem'&&l.status==='pending').forEach(fulfill);
render();
