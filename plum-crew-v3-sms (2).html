<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plum Crew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --top:#17171c; --top2:#24242b; --topText:#e9e9ef; --topMuted:#9a9aa8;
  --purple:#5b2fd6; --purpleD:#4822b3; --purpleL:#efe9fd; --purpleM:#d9ccfb;
  --bg:#f3f3f6; --card:#fff; --line:#e3e3ea; --line2:#eeeef3;
  --text:#1b1b22; --muted:#5b5d6b; --faint:#80828f;
  --red:#b3261e; --redL:#fdecea; --amber:#935400; --amberL:#fff3dc;
  --green:#1b7340; --greenL:#e5f4ea; --blue:#1d5bb5; --blueL:#e7effb;
  --grayL:#f0f0f4;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--purple)}
.mono{font-family:var(--mono)}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top bar */
.top{background:var(--top);color:var(--topText);height:52px;display:flex;align-items:center;gap:14px;padding:0 16px;position:sticky;top:0;z-index:30}
.logo{width:30px;height:30px;border-radius:8px;background:var(--purple);display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none}
.brand{font-weight:600;font-size:15px;white-space:nowrap}
.top .sep{width:1px;height:20px;background:#3a3a44}
.top .crumb{color:var(--topMuted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .grow{flex:1}
.top .date{font-family:var(--mono);color:var(--topMuted);font-size:13px;white-space:nowrap}
.avatar{width:32px;height:32px;border-radius:50%;background:#2b63d9;color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.topbtn{background:var(--top2);border:1px solid #34343e;color:var(--topText);border-radius:8px;height:32px;padding:0 10px;display:flex;align-items:center;gap:6px;font-size:13px}
.topbtn:hover{background:#2e2e37}
.ctx{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--topText);white-space:nowrap}
.ctx .pill{background:#2d2d36;border:1px solid #3c3c47;border-radius:999px;padding:3px 10px}

/* demo strip */
.demo{background:#fbfaff;border-bottom:1px solid var(--purpleM);padding:8px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.demo .tag{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--purpleD);font-weight:600;background:var(--purpleL);border:1px solid var(--purpleM);padding:2px 8px;border-radius:4px}
.demo label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.demo select{height:32px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 8px;font-size:13px;min-width:0}
.demo select:disabled{background:var(--grayL);color:var(--faint)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:5px 12px;font-size:13px;min-height:30px}
.seg button.on{background:var(--purple);color:#fff}
.dbtn{height:32px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:0 10px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.dbtn:hover{border-color:var(--purple);color:var(--purpleD)}
.dbtn.warn{color:var(--red)}
.chk{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.chk input{accent-color:var(--purple);width:16px;height:16px}
.demo-toggle{display:none}
@media (max-width:760px){
  .demo-toggle{display:inline-flex}
  .demo.collapsed > :not(.demo-head){display:none}
  .top .crumb,.top .sep,.top .date,.ctx .pill.hide-m,.top .brand,.hide-s{display:none}
  .top{gap:8px;padding:0 10px}
  .ctx{min-width:0;flex:1}.ctx .pill{overflow:hidden;text-overflow:ellipsis;font-size:12px}
  .top .grow{display:none}
}
.demo-head{display:flex;align-items:center;gap:10px}

/* layout */
.wrap{max-width:1320px;margin:0 auto;padding:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px}
.panel-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.panel-h h1,.panel-h h2{margin:0;font-size:17px;font-weight:600}
.panel-b{padding:16px 18px}
.ico{width:24px;height:24px;border-radius:6px;background:var(--purpleL);color:var(--purple);display:grid;place-items:center;flex:none}
.ico svg{width:14px;height:14px}
.sub{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line2);align-items:center}
.tab{border:0;background:transparent;border-radius:999px;padding:8px 14px;font-weight:500;color:#3a3b46;display:inline-flex;align-items:center;gap:6px;min-height:38px}
.tab:hover{background:var(--grayL)}
.tab.on{background:var(--purple);color:#fff}
.tab .cnt{font-family:var(--mono);font-size:11px;background:var(--redL);color:var(--red);border-radius:999px;padding:0 6px}
.tab.on .cnt{background:#fff;color:var(--purpleD)}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:0 14px;min-height:38px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:#c9c9d4}
.btn.p{background:var(--purple);border-color:var(--purple);color:#fff}
.btn.p:hover{background:var(--purpleD)}
.btn.d{color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.btn.link{border:0;background:none;color:var(--purple);padding:0 4px;min-height:auto}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.g6{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2,.g3{grid-template-columns:1fr}.g6{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:10px}}

/* KPI card like reference */
.kpi{border:1px solid var(--line);border-top:3px solid var(--c,var(--purple));border-radius:8px;padding:10px 12px;background:#fff;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
button.kpi:hover{box-shadow:0 1px 0 var(--line),0 4px 14px rgba(20,20,40,.06)}
.kpi .lab{font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:6px}
.kpi .dot{width:16px;height:16px;border-radius:4px;background:var(--cl,var(--purpleL));display:grid;place-items:center}
.kpi .dot i{width:6px;height:6px;border-radius:50%;background:var(--c,var(--purple))}
.kpi .val{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:-.02em}
.kpi .foot{display:flex;justify-content:space-between;gap:6px;border-top:1px solid var(--line2);padding-top:6px;margin-top:2px}
.kpi .foot div{display:flex;flex-direction:column;min-width:0}
.kpi .foot small{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.kpi .foot span{font-family:var(--mono);font-size:12.5px}
.flag{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:4px;margin-left:auto;white-space:nowrap}

/* status pills: text + color */
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.need{background:var(--redL);color:var(--red)}
.st.prog{background:var(--amberL);color:var(--amber)}
.st.done{background:var(--greenL);color:var(--green)}
.st.info{background:var(--blueL);color:var(--blue)}
.st.mute{background:var(--grayL);color:var(--muted)}
.st.pur{background:var(--purpleL);color:var(--purpleD)}

/* table */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-weight:600;font-size:12.5px;color:#3d3e4a;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fafafc}
.tbl td{padding:12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#faf9ff}
.tbl .num{font-family:var(--mono);text-align:right;white-space:nowrap}
.tbl th.num{text-align:right;font-family:var(--sans)}
.idx{font-family:var(--mono);color:var(--faint);font-size:12px}

/* list items */
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line2)}
.item:last-child{border-bottom:0}
.item .t{font-weight:600}
.item .grow{flex:1;min-width:0}
.alert{border:1px solid;border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.alert.r{background:var(--redL);border-color:#f3c5c1;color:#7c1a14}
.alert.a{background:var(--amberL);border-color:#f0d7a6;color:#6a3d00}
.alert.b{background:var(--blueL);border-color:#c5d7f3;color:#173f7a}
.alert.g{background:var(--greenL);border-color:#bfe3cc;color:#135530}
.alert .grow{flex:1;min-width:200px}
.card{border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff}
.card h3{margin:0 0 8px;font-size:14.5px}
.label{font-size:12px;font-weight:600;color:#3d3e4a;margin:0 0 6px;display:block}
.field{margin-bottom:14px}
input.in,textarea.in,select.in{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff;min-height:40px}
textarea.in{resize:vertical;min-height:84px}
input.in:focus,textarea.in:focus,select.in:focus{outline:2px solid var(--purpleM);border-color:var(--purple)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;min-height:38px;font-size:13.5px}
.chip.on{background:var(--purpleL);border-color:var(--purple);color:var(--purpleD);font-weight:600}
.chip:disabled{opacity:.5;cursor:not-allowed}
.meter{height:8px;border-radius:999px;background:var(--grayL);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.bar-row{display:grid;grid-template-columns:110px 1fr 60px;gap:10px;align-items:center;font-size:13px;margin:6px 0}
.demo-badge{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.05em;color:var(--purpleD);background:var(--purpleL);border:1px dashed var(--purple);border-radius:4px;padding:1px 6px;white-space:nowrap}
.est{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.05em;color:var(--amber);background:var(--amberL);border:1px dashed var(--amber);border-radius:4px;padding:1px 6px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.step{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--grayL);font-size:13px;color:var(--muted)}
.step b{width:24px;height:24px;border-radius:50%;background:#fff;display:grid;place-items:center;font-family:var(--mono);font-size:12px}
.step.on{background:var(--purpleL);color:var(--purpleD);font-weight:600}
.step.on b{background:var(--purple);color:#fff}
.step.ok b{background:var(--green);color:#fff}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
@media (max-width:960px){.two{grid-template-columns:1fr}}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
.msg{padding:10px 12px;border-radius:10px;background:var(--grayL);margin:8px 0;max-width:90%}
.msg.me{background:var(--purpleL);margin-left:auto}
.msg .who{font-size:12px;color:var(--muted);margin-bottom:2px;display:flex;gap:6px;flex-wrap:wrap}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.tl div{position:relative;font-size:13px;margin:6px 0;color:var(--muted)}
.tl div::before{content:"";position:absolute;left:-19px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--purple)}
.back{border:0;background:none;color:var(--purple);font-weight:600;padding:6px 0;display:inline-flex;align-items:center;gap:4px;min-height:36px}

/* phone / employee */
.emp-stage{display:flex;gap:24px;justify-content:center;align-items:flex-start;padding:10px 0 30px}
.phone{width:390px;max-width:100%;background:#fafafd;border:1px solid #d6d6df;border-radius:34px;box-shadow:0 20px 50px rgba(20,20,40,.12);overflow:hidden;display:flex;flex-direction:column;height:800px;position:relative}
.ph-top{background:var(--top);color:#fff;padding:14px 16px 12px;display:flex;align-items:center;gap:10px}
.ph-top .s{font-size:12px;color:var(--topMuted)}
.ph-body{flex:1;overflow-y:auto;padding:16px}
.ph-nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:#fff}
.ph-nav button{border:0;background:none;padding:8px 2px 10px;min-height:60px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);position:relative}
.ph-nav button svg{width:22px;height:22px}
.ph-nav button.on{color:var(--purple);font-weight:600}
.ph-nav .badge{position:absolute;top:6px;left:calc(50% + 6px);background:var(--red);color:#fff;border-radius:999px;font-size:10px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px}
.langsw{display:inline-flex;border:1px solid #444452;border-radius:999px;overflow:hidden}
.langsw button{border:0;background:transparent;color:#cfd0da;font-size:12px;font-weight:600;padding:6px 10px;min-height:32px}
.langsw button.on{background:#fff;color:var(--top)}
.bell{position:relative;border:0;background:#2b2b34;color:#fff;border-radius:50%;width:36px;height:36px;display:grid;place-items:center}
.bell .badge{position:absolute;top:-2px;right:-2px;background:var(--red);color:#fff;border-radius:999px;font-size:10px;min-width:16px;height:16px;display:grid;place-items:center}
.ecard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.ecard .k{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.ecard .h{font-size:17px;font-weight:600;margin:2px 0 4px;line-height:1.3}
.ecard p{margin:4px 0 12px;color:#3b3c47;font-size:15px}
.ebtn{width:100%;min-height:50px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:16px;font-weight:600}
.ebtn.p{background:var(--purple);border-color:var(--purple);color:#fff}
.ebtn.p:disabled{opacity:.45}
.ebtn + .ebtn{margin-top:8px}
.ph-body h2{font-size:22px;margin:4px 0 6px;line-height:1.25}
.ph-body .lead{font-size:15.5px;color:#3b3c47;margin:0 0 16px}
.bigopt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:14px;background:#fff;padding:16px;font-size:17px;font-weight:600;min-height:60px;margin-bottom:10px}
.bigopt.on{border-color:var(--purple);background:var(--purpleL)}
.bigopt small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.plist{list-style:none;padding:0;margin:0 0 16px}
.plist li{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2);font-size:15px}
.plist li svg{flex:none;color:var(--purple);margin-top:2px}
.qr{width:170px;height:170px;margin:12px auto;display:block;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.prog-dots{display:flex;gap:6px;margin:10px 0}
.prog-dots i{flex:1;height:10px;border-radius:999px;background:var(--grayL)}
.prog-dots i.f{background:var(--purple)}
.shift{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line2)}
.shift .d{width:46px;text-align:center;font-family:var(--mono);font-size:12px;color:var(--muted);line-height:1.2}
.shift .d b{display:block;font-size:17px;color:var(--text)}
.bal{background:var(--top);color:#fff;border-radius:16px;padding:18px;margin-bottom:12px}
.bal .v{font-family:var(--mono);font-size:34px;font-weight:600}
.side-notes{width:320px;flex:none}
.notif{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px}
.notif .nl{width:28px;height:28px;border-radius:7px;background:var(--purple);color:#fff;font-weight:700;font-size:11px;display:grid;place-items:center;flex:none}
.notif .nt{font-size:13.5px}
.notif .nm{font-size:11.5px;color:var(--faint);font-family:var(--mono)}
.sheet-bg{position:absolute;inset:0;background:rgba(15,15,25,.4);display:flex;align-items:flex-end;z-index:5}
.sheet{background:#fff;border-radius:20px 20px 0 0;padding:18px 16px 20px;width:100%;max-height:85%;overflow-y:auto}
.skel{background:linear-gradient(90deg,#eee 25%,#f6f6f6 37%,#eee 63%);background-size:400% 100%;animation:sk 1.2s ease infinite;border-radius:10px}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
@media (max-width:1000px){.side-notes{display:none}}
@media (max-width:520px){
  .emp-stage{padding:0}
  .phone{border-radius:0;border:0;box-shadow:none;height:calc(100vh - 52px);width:100%}
  body.emp .wrap{padding:0}
}

/* modal & toast & guide */
.modal-bg{position:fixed;inset:0;background:rgba(15,15,25,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
.guide{position:fixed;right:0;top:0;bottom:0;width:380px;max-width:100%;background:#fff;border-left:1px solid var(--line);z-index:60;box-shadow:-10px 0 40px rgba(20,20,40,.12);display:flex;flex-direction:column}
.guide ol{margin:0;padding:0;list-style:none;counter-reset:g}
.guide li{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.guide li .n{width:24px;height:24px;border-radius:50%;background:var(--grayL);display:grid;place-items:center;font-family:var(--mono);font-size:12px;flex:none}
.guide li.ok .n{background:var(--green);color:#fff}
.guide li.ok .gt{color:var(--muted)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--top);color:#fff;padding:10px 16px;border-radius:10px;z-index:70;font-size:13.5px;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:92vw}
.preview-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.preview-pair{grid-template-columns:1fr}}
.mini{border:1px solid var(--line);border-radius:18px;background:#fafafd;overflow:hidden}
.mini .mh{background:var(--top);color:#fff;padding:8px 12px;font-size:12px;display:flex;justify-content:space-between}
.mini .mb{padding:12px}
.push{background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:12.5px;display:flex;gap:8px;margin-bottom:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}
.wiz-foot{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line2);padding-top:14px;margin-top:6px;flex-wrap:wrap}
.opt-card{border:1.5px solid var(--line);border-radius:12px;padding:14px;background:#fff;text-align:left;width:100%}
.opt-card.on{border-color:var(--purple);background:#fbf9ff}
.opt-card:disabled{opacity:.7;cursor:not-allowed}
.small{font-size:12.5px}
.muted{color:var(--muted)}

  const body=(`${(tx.t||'').trim()}. ${(tx.b||'').trim()}`).replace(/([?!.])\./g,'$1').replace(/\s+/g,' ').trim();
  let s;
  if(u.mode==='important') s=LL(lang,`${h}: IMPORTANT – ${body} Reply ACK ${u.ref} to confirm you read it${by}.`,`${h}: IMPORTANTE – ${body} Responde ACK ${u.ref} para confirmar que lo leíste${by}.`);

  else s=`${h}: ${body}`;

function deliver(u){
  u.rec={}; u.excluded=[]; u.sentT=S.t; if(u.sentDay==null) u.sentDay=S.day;

    u.rec[p.id]={msg:m.id,ack:false,ackVia:null,reply:null,visits:0,reminded:false,link:tok};

function recSt(r){ const m=msgById(r.msg); return m?m.st:'queued'; }
function uCounts(u,locs){
  const c={selected:0,eligible:0,excluded:0,queued:0,sent:0,delivered:0,unknown:0,failed:0,replied:0,ack:0,visited:0};
  const inL=pid=>{ const p=P(pid); return p&&(!locs||p.locs.some(l=>locs.includes(l))); };
  Object.entries(u.rec||{}).forEach(([pid,r])=>{ if(!inL(pid)) return; c.eligible++; const s=recSt(r); c[s]=(c[s]||0)+1; if(r.reply)c.replied++; if(r.ack)c.ack++; if(r.visits)c.visited++; });
  (u.excluded||[]).forEach(x=>{ if(inL(x.pid)) c.excluded++; }); c.selected=c.eligible+c.excluded; return c;
}


/* ---------- budgets & rewards ---------- */
function creditsAt(loc){ return S.ledger.filter(l=>l.kind==='credit'&&l.loc===loc&&l.status==='earned'); }
function spentLoc(loc,m){ m=m??monthOf(S.day); return creditsAt(loc).filter(l=>monthOf(l.day)===m).reduce((a,l)=>a+l.amt,0); }
function reservedLoc(loc){ return S.goals.filter(g=>g.loc===loc&&g.status==='active').reduce((a,g)=>a+(g.eligible.filter(p=>g.done[p]==null).length*g.reward),0); }
function availLoc(loc){ return L(loc).budget-spentLoc(loc)-reservedLoc(loc); }
function issuedLoc(loc,m){ m=m??monthOf(S.day); return S.ledger.filter(l=>l.kind==='redeem'&&l.loc===loc&&l.status==='issued'&&monthOf(l.day)===m).reduce((a,l)=>a+l.amt,0); }
function owedLoc(loc){ // earned but not yet issued (what funding must cover)
  const cr=S.ledger.filter(l=>l.kind==='credit'&&l.loc===loc&&l.status==='earned').reduce((a,l)=>a+l.amt,0);
  const rd=S.ledger.filter(l=>l.kind==='redeem'&&l.loc===loc&&l.status==='issued').reduce((a,l)=>a+l.amt,0);
  return Math.max(0,cr-rd);
}
function fundState(loc){ const f=L(loc).funded, need=owedLoc(loc)+reservedLoc(loc); if(f<=0) return 'empty'; if(f<need) return 'low'; return 'ok'; }
function mgrSpent(mid,m){ m=m??monthOf(S.day); return S.recogs.filter(r=>r.from===mid&&r.reward==='approved'&&monthOf(r.day)===m).reduce((a,r)=>a+r.amt,0); }
function approvalNeed(from,loc,amt){ if(!amt) return null; const p=P(from); if(p.perm==='owner') return amt>availLoc(loc)?'budget':null; if(amt>availLoc(loc)) return 'budget'; if(mgrSpent(from)+amt>p.limit) return 'limit'; return null; }
function balance(pid){ let b=0; S.ledger.filter(l=>l.pid===pid).forEach(l=>{ if(l.kind==='credit'&&l.status==='earned') b+=l.amt; if(l.kind==='redeem'&&['pending','issued','waiting','funding'].includes(l.status)) b-=l.amt; }); return b; }

/* ---------- coverage & SMS reach ---------- */
function coverage(locs,days){ const since=S.day-(days||30); const team=crew(locs).filter(p=>p.status!=='deactivated');
  const got=new Set(S.recogs.filter(r=>r.kind!=='peer'&&r.day>since&&team.some(p=>p.id===r.to)).map(r=>r.to));
  const byRole={}; team.forEach(p=>{ byRole[p.role]=byRole[p.role]||{n:0,r:0}; byRole[p.role].n++; if(got.has(p.id)) byRole[p.role].r++; });
  return {team,got,missing:team.filter(p=>!got.has(p.id)),byRole};
}
/* SMS enrollment state shown to managers (derived from the separate fields) */
function smsState(p){
  if(p.status==='deactivated') return 'deactivated';
  if(p.consent==='withdrawn'||p.consent==='declined') return 'optout';
  if(p.delivery==='failed') return 'issue';
  if(p.status==='active') return 'active';
  if(p.status==='incomplete') return 'incomplete';
  if(p.status==='invited') return 'invited';
  return 'none';
}
function smsStats(locs){ const team=crew(locs).filter(p=>p.status!=='deactivated'); const c={team:team.length,active:0,invited:0,incomplete:0,none:0,optout:0,issue:0};

function recalcGoal(st,g){ if(g.method!=='auto') return; g.eligible.forEach(pid=>{ const sh=(g.shifts&&g.shifts[pid])||[]; let n=0,run=0,best=0; sh.forEach(s=>{ if(s.st==='on_time'||s.st==='fixed'||s.st==='excused_ok'){ n++; run++; best=Math.max(best,run);} else if(s.st==='late'){ run=0; } }); const ok=g.consec?best>=g.target:n>=g.target; if(ok&&g.done[pid]==null) g.done[pid]=st.day; }); }
function goalProgress(g,pid){ if(g.method==='manager') return {n:g.done[pid]!=null?1:0,target:1}; const sh=(g.shifts[pid]||[]); const n=sh.filter(s=>s.st==='on_time'||s.st==='fixed').length; return {n,target:g.target,left:sh.filter(s=>s.st==='upcoming').length}; }
function awardGoals(){ S.goals.forEach(g=>{ if(g.status!=='active') return; recalcGoal(S,g); g.eligible.forEach(pid=>{ if(g.done[pid]!=null&&!S.ledger.some(l=>l.src==='goal'&&l.ref===g.id&&l.pid===pid)){ S.ledger.push({id:uid('L'),pid,kind:'credit',amt:g.reward,src:'goal',ref:g.id,loc:g.loc,status:'earned',day:S.day}); notify(pid,{type:'goal',amt:g.reward}); } }); if(S.day>g.end) g.status='ended'; }); }

/* ============ Messaging engine (simulated — nothing is really sent) ============ */
const BIZ=()=>S.org.number||'(951) 555-0199';
function ORGN(){ return S.org.name||'Plum Crew'; }
function headFor(p){ const st=p&&p.locs[0]?L(p.locs[0]).name:''; return multi()&&st?`${ORGN()} – ${st}`:ORGN(); }
function LL(lang,en,es){ return lang==='es'?es:en; }
/* smart punctuation is converted so texts stay in the cheaper GSM-7 encoding when possible */
function smsNorm(s){ return String(s==null?'':s).replace(/[“”«»]/g,'"').replace(/[‘’]/g,"'").replace(/[–—]/g,'-').replace(/…/g,'...'); }
function hm(t){ let h=Math.floor(t/60), m=t%60; const ap=h>=12?'PM':'AM'; h=h%12||12; return h+':'+String(m).padStart(2,'0')+' '+ap; }
function tick(n){ S.t=Math.min(S.t+(n==null?1:n),23*60+58); }
function stampS(m,lang){ lang=lang||S.lang; return (m.day===S.day?LL(lang,'Today','Hoy'):m.day===S.day-1?LL(lang,'Yesterday','Ayer'):fd(m.day,lang,{month:'short',day:'numeric'}))+' '+hm(m.t); }
function byTime(a,b){ return (a.day-b.day)||(a.t-b.t)||(a.seq-b.seq); }
function msgById(id){ return S.msgs.find(m=>m.id===id); }
function lastIn(pid){ return S.msgs.filter(m=>m.pid===pid&&m.dir==='in').sort(byTime).pop(); }
function nextRef(){ return ++S.refSeq; }
function trunc(s,n){ s=String(s||''); return s.length>n?s.slice(0,n-1).trim()+'…':s; }
function defaultAssignee(pid){ const p=P(pid); const loc=p&&p.locs[0]; if(S.org.kind==='single') return S.org.owner; const m=S.people.find(x=>x.perm==='manager'&&x.role==='Store manager'&&x.mgrLocs.includes(loc)); return m?m.id:S.org.owner; }
function cvOf(pid){ if(!S.cv[pid]) S.cv[pid]={assignee:defaultAssignee(pid),state:'open',needs:false,since:null,read:{},overdueSent:false}; return S.cv[pid]; }
function addMsg(o){
  const m=Object.assign({id:uid('m'),seq:++S.seq,day:S.day,t:S.t,ctx:null,tr:null,onPhone:false,auto:false,restricted:false},o);
  S.msgs.push(m); const c=cvOf(m.pid);
  if(m.dir==='in'&&!m.auto&&!m.restricted) setNeeds(c,m);
  if(m.dir==='out'&&m.kind==='reply'&&!m.restricted&&m.st!=='review'){ c.needs=false; c.since=null; if(S.auto) S.auto.touch.log.forEach(t=>{ if(t.pid===m.pid&&t.flag){ t.flag=false; t.followed=S.day; } }); }
  return m;
}
function setNeeds(c,m){ c.needs=true; if(!c.since) c.since={day:m.day,t:m.t}; c.state='open'; c.overdueSent=false; }
const WHY={invalid:['Invalid phone number','Número de teléfono inválido'],landline:['Carrier rejected: this number can’t receive texts (landline?)','El operador rechazó: este número no recibe mensajes (¿fijo?)'],carrier:['Carrier error — not delivered','Error del operador: no se entregó']};
function whyL(k){ const w=WHY[k]; return w?X(w[0],w[1]):''; }
function finalFor(p,m){
  if(!validPhone(p.phone)) return ['failed','invalid'];
  if(p.unreachable) return ['failed','landline'];
  if(S.demo.smsFail){ S.demo.smsFail=false; return ['failed','carrier']; }
  if(hsh(m.id+'u')<.05) return ['unknown',null];
  return ['delivered',null];
}
function sendText(pid,text,o={}){
  const p=P(pid); const lang=o.lang||p.lang;
  const m=addMsg({pid,dir:'out',via:o.via||'auto',author:o.author||null,kind:o.kind||'auto',text:{lang,text:smsNorm(text)},onPhone:true,st:'queued',ctx:o.ctx||null,link:o.link||null,restricted:!!o.restricted,orig:o.orig||null});
  dispatch(m,o.seed||S._seeding); return m;
}
function dispatch(m,instant){
  const p=P(m.pid); const [fin,why]=finalFor(p,m); m.final=fin; m.whyK=why; m.st='queued';
  if(instant||fin==='failed'&&why==='invalid'){ setFinal(m); return; }
  tick(1);
  setTimeout(()=>{ if(S.msgs.includes(m)&&m.st==='queued'){ m.st='sent'; render(); } },500);
  setTimeout(()=>{ if(S.msgs.includes(m)&&(m.st==='queued'||m.st==='sent')){ setFinal(m); render(); } },1500);
}
function setFinal(m){ m.st=m.final||'delivered'; const p=P(m.pid); if(!p) return; if(m.st==='failed'){ p.delivery='failed'; p.deliveryNote=m.whyK; } else if(m.st==='delivered'){ p.delivery='ok'; p.deliveryNote=null; } }
/* secure links (each one belongs to one person) */
const LPFX={enroll:'e',reward:'r',hub:'m',private:'p',anon:'a',update:'u',goal:'g',case:'c',thank:'t',exit:'x'};
function mkLink(pid,kind,ref,days){ const tok=(LPFX[kind]||'x')+'/'+(Math.random().toString(36).slice(2,6).toUpperCase().padEnd(4,'X')); S.links[tok]={tok,pid,kind,ref:ref||null,day:S.day,exp:S.day+(days||7),used:false,verified:false,visits:0}; return tok; }
function linkUrl(tok){ return 'plumcrew.app/'+tok; }
/* structured requests an employee can answer by text */
function addReq(pid,kind,target,ref,until){ S.reqs.filter(r=>r.pid===pid&&r.kind===kind&&r.target.type===target.type&&r.target.id===target.id).forEach(r=>r.active=false); const r={id:uid('q'),pid,kind,target,ref,until:until==null?null:until,active:true,day:S.day,seq:S.seq}; S.reqs.push(r); return r; }
function activeReqs(pid){ return S.reqs.filter(r=>r.pid===pid&&r.active&&(r.until==null||S.day<=r.until)); }
function reqLabel(r,lang){ const tg=r.target;
  if(tg.type==='update'){ const u=S.updates.find(x=>x.id===tg.id); return u?trunc(uText(u,lang).t,34):'—'; }
  if(tg.type==='pulse'||tg.type==='touch') return LL(lang,`check-in ${r.ref}`,`pregunta ${r.ref}`);
  if(tg.type==='feedback') return LL(lang,`case ${r.ref}`,`caso ${r.ref}`);
  return '—'; }
function guessLang(txt,def){ if(/[ñáéíóú¿¡]|\b(que|puedo|turno|gracias|hoy|mañana|tengo|voy|sí|si puedo|yo|necesito|cuándo|dónde|por favor)\b/i.test(txt)) return 'es'; if(/\b(the|can|i|you|my|is|late|today|shift|please|thanks|what|when|yes)\b/i.test(txt)) return 'en'; return def; }
const KW={stop:/^(stop|stopall|unsubscribe|cancel|end|quit|alto|parar)$/i,start:/^(start|unstop|iniciar)$/i,help:/^(help|info|ayuda)$/i};
function receiveText(pid,raw){
  const p=P(pid); const txt=String(raw||'').trim(); if(!p||!txt) return null;
  if(!S._seeding) tick(1);
  const m=addMsg({pid,dir:'in',via:'sms',text:{lang:guessLang(txt,p.lang),text:txt},onPhone:true,auto:true});
  const w=txt.replace(/[.!¡¿?,]/g,'').trim();
  if(KW.stop.test(w)) { doStop(p,m); return m; }
  if(KW.start.test(w)&&(p.consent==='withdrawn'||p.consent==='declined')) { doStart(p,m); return m; }
  if(KW.help.test(w)) { doHelp(p,m); return m; }
  if(p.consent==='withdrawn'||p.consent==='declined'||p.status==='deactivated'){ freeText(p,m,true); return m; }
  const cl=S.clar[pid];
  if(cl){ delete S.clar[pid]; const d=w.match(/^(\d)$/); if(d&&+d[1]>=1&&+d[1]<=cl.other){ resolveClar(p,m,cl,+d[1]); return m; } }
  let mm=w.match(/^(?:ack|ok|okay|got it|entendido|listo|confirmo|recibido)\s*#?\s*(\d{2,})?$/i);
  if(mm){ const ack=activeReqs(pid).filter(r=>r.kind==='ack');
    if(mm[1]){ const r=ack.find(x=>x.ref===+mm[1]); if(r) applyAck(p,m,r,'ref'); else noRef(p,m,mm[1]); return m; }
    if(ack.length===1){ applyAck(p,m,ack[0],'only'); return m; }
    if(ack.length>1){ clarifyAck(p,m,ack); return m; }
  }
  let d=null, ref=null; let z=w.match(/^([1-3])(?:\s+(?:for|para)?\s*#?(\d{2,}))?$/i); if(z){ d=+z[1]; ref=z[2]?+z[2]:null; } else { z=w.match(/^#?(\d{2,})\s+([1-3])$/); if(z){ d=+z[2]; ref=+z[1]; } }
  if(d){ const ch=activeReqs(pid).filter(r=>r.kind==='choice');
    if(ref){ const r=ch.find(x=>x.ref===ref); if(r) applyChoice(p,m,r,d,'ref'); else noRef(p,m,ref); return m; }
    if(ch.length===1){ applyChoice(p,m,ch[0],d,'only'); return m; }
    if(ch.length>1){ clarifyChoice(p,m,ch,d); return m; }
    const an=anonOpenFor(p); if(an){ anonByText(p,m,an); return m; }
  }
  freeText(p,m); return m;
}
function freeText(p,m,quiet){ m.auto=false; setNeeds(cvOf(p.id),m);
  if(!quiet){ /* only questions this person hasn't texted anything since — otherwise it's probably a new topic */
    const ans=activeReqs(p.id).filter(r=>r.kind==='answer'&&r.target.type==='update'&&!S.msgs.some(x=>x.pid===p.id&&x.dir==='in'&&x.seq>r.seq&&x.id!==m.id));
    if(ans.length===1) applyAnswer(p,m,ans[0],'only');
    else if(ans.length>1) clarifyFree(p,m,ans);
    else m.matched={how:'general'}; }
  else m.matched={how:'optedout'};
  notifyStaff(p,m); }
function applyAck(p,m,r,how){ const u=S.updates.find(x=>x.id===r.target.id); r.active=false; if(!u) return;
  const rec=u.rec[p.id]; if(rec&&!rec.ack){ rec.ack=true; rec.ackVia='sms'; rec.ackDay=S.day; rec.ackMsg=m.id; act(p.id,'ack'); }
  m.ctx={type:'update',id:u.id,ref:u.ref}; m.matched={how,what:'ack'};
  sendText(p.id,LL(p.lang,`Thanks, ${first(p.name)}. Confirmed: “${trunc(uText(u,p.lang).t,48)}”.`,`Gracias, ${first(p.name)}. Confirmado: “${trunc(uText(u,p.lang).t,48)}”.`),{kind:'confirm',ctx:m.ctx}); }
function applyChoice(p,m,r,d,how){ r.active=false;
  if(r.target.type==='pulse'){ const pu=S.pulses.find(x=>x.id===r.target.id); if(!pu) return; const v=['yes','some','no'][d-1];
    if(pu.status==='open'&&!pu.answered.includes(p.id)){ pu.answered.push(p.id); pu.responses.push({pid:p.id,v,via:'sms'}); act(p.id,'pulse'); }
    m.ctx={type:'pulse',id:pu.id,ref:pu.ref}; m.matched={how,what:'checkin',v};
    sendText(p.id,LL(p.lang,`Thanks – your answer to check-in ${pu.ref} was recorded.`,`Gracias: tu respuesta a la pregunta ${pu.ref} quedó registrada.`),{kind:'confirm',ctx:m.ctx}); return; }
  if(r.target.type==='touch'){ const t=S.auto.touch.log.find(x=>x.id===r.target.id); if(!t) return; const v=['great','ok','rough'][d-1]; t.resp=v; t.respDay=S.day; act(p.id,'pulse');
    m.ctx={type:'touch',id:t.id,ref:t.ref}; m.matched={how,what:'touch',v,n:t.n};
    if(d===3){ t.flag=true; m.auto=false; setNeeds(cvOf(p.id),m); const mg=P(cvOf(p.id).assignee); sendText(p.id,LL(p.lang,`Thanks for being honest, ${first(p.name)}. ${first(mg.name)} will reach out soon. You can also reply here anytime, or text HELP for a private line to the owner.`,`Gracias por tu sinceridad, ${first(p.name)}. ${first(mg.name)} te contactará pronto. También puedes responder aquí o enviar AYUDA para hablar en privado con la dueña.`),{kind:'confirm',ctx:m.ctx}); notifyStaff(p,m); }
    else sendText(p.id,LL(p.lang,d===1?'Great to hear - thanks! Reply anytime if you need anything.':'Thanks for letting us know. Reply anytime if something would help.',d===1?'¡Qué bueno, gracias! Responde cuando necesites algo.':'Gracias por contarnos. Responde cuando quieras si algo te ayudaría.'),{kind:'confirm',ctx:m.ctx});
    return; }
  if(r.target.type==='feedback'){ const f=S.feedback.find(x=>x.id===r.target.id); if(!f) return; m.ctx={type:'feedback',id:f.id,ref:f.ref};
    if(d===1){ m.matched={how,what:'fixed'}; f.status='confirmed'; f.hist.push({day:S.day,k:'h_confirmed'}); act(p.id,'feedback'); sendText(p.id,LL(p.lang,`Thanks for confirming. Case ${f.ref} is closed.`,`Gracias por confirmar. El caso ${f.ref} quedó cerrado.`),{kind:'confirm',ctx:m.ctx}); }
    else { m.matched={how,what:'notfixed'}; f.status='reopened'; f.nextBy=S.day+1; f.hist.push({day:S.day,k:'h_reopened'}); m.auto=false; setNeeds(cvOf(p.id),m); sendText(p.id,LL(p.lang,`Thanks – case ${f.ref} is reopened. ${first(P(f.handler).name)} will update you by ${shortDate(f.nextBy,p.lang)}. Reply here with what still needs fixing.`,`Gracias: el caso ${f.ref} se reabrió. ${first(P(f.handler).name)} te responderá a más tardar el ${shortDate(f.nextBy,p.lang)}. Responde aquí con lo que falta arreglar.`),{kind:'confirm',ctx:m.ctx}); notifyStaff(p,m); }
  } }
function applyAnswer(p,m,r,how){ const tg=r.target;
  if(tg.type==='update'){ const u=S.updates.find(x=>x.id===tg.id); r.active=false; if(!u) return; const rec=u.rec[p.id]; if(rec&&!rec.reply){ rec.reply=m.id; act(p.id,'reply'); }
    m.ctx={type:'update',id:u.id,ref:u.ref}; m.matched={how,what:'answer'};
    sendText(p.id,LL(p.lang,`Thanks! Your answer about “${trunc(uText(u,p.lang).t,40)}” was sent to ${first(P(u.author).name)}.`,`¡Gracias! Tu respuesta sobre “${trunc(uText(u,p.lang).t,40)}” se envió a ${first(P(u.author).name)}.`),{kind:'confirm',ctx:m.ctx}); }
  if(tg.type==='feedback'){ const f=S.feedback.find(x=>x.id===tg.id); if(!f) return; m.ctx={type:'feedback',id:f.id,ref:f.ref}; m.matched={how,what:'case'}; f.hist.push({day:S.day,k:'h_empmsg'});
    if(how==='clarified') sendText(p.id,LL(p.lang,`Got it – added to case ${f.ref}.`,`Listo: se agregó al caso ${f.ref}.`),{kind:'confirm',ctx:m.ctx}); } }
function clarifyFree(p,m,reqs){ const opts=reqs.slice(0,3); const other=opts.length+1; S.clar[p.id]={msg:m.id,opts:opts.map(r=>r.id),other};
  const lst=opts.map((r,i)=>`${i+1} ${LL(p.lang,'for','para')} “${reqLabel(r,p.lang)}”`).join(', ');
  m.matched={how:'pending'};
  sendText(p.id,LL(p.lang,`Thanks! Which is this about? Reply ${lst}, or ${other} for something else.`,`¡Gracias! ¿Sobre cuál es? Responde ${lst}, o ${other} si es otra cosa.`),{kind:'clarify'}); }
function resolveClar(p,m,cl,d){ const orig=msgById(cl.msg); m.matched={how:'clarifier',of:cl.msg};
  if(d<=cl.opts.length){ const r=S.reqs.find(x=>x.id===cl.opts[d-1]); if(r&&orig){ applyAnswer(p,orig,r,'clarified'); return; } }
  if(orig) orig.matched={how:'general',clarified:true};
  sendText(p.id,LL(p.lang,'Got it – your message went to your managers.','Listo: tu mensaje se envió a tus gerentes.'),{kind:'confirm'}); }
function clarifyAck(p,m,acks){ const lst=acks.slice(0,3).map(r=>`ACK ${r.ref} ${LL(p.lang,'for','para')} “${reqLabel(r,p.lang)}”`).join(LL(p.lang,', or ',', o '));
  m.matched={how:'pending'};
  sendText(p.id,LL(p.lang,`You have ${acks.length} updates to confirm. Reply ${lst}.`,`Tienes ${acks.length} avisos por confirmar. Responde ${lst}.`),{kind:'clarify'}); }
function clarifyChoice(p,m,ch,d){ const lst=ch.slice(0,3).map(r=>`“${d} ${r.ref}” ${LL(p.lang,'for','para')} ${reqLabel(r,p.lang)}`).join(LL(p.lang,', or ',', o '));
  m.matched={how:'pending'};
  sendText(p.id,LL(p.lang,`Which one is your answer for? Reply ${lst}.`,`¿A cuál corresponde tu respuesta? Responde ${lst}.`),{kind:'clarify'}); }
function noRef(p,m,ref){ m.auto=false; m.matched={how:'noref',ref}; setNeeds(cvOf(p.id),m);
  sendText(p.id,LL(p.lang,`We couldn’t find an open request ${ref}. Your message was sent to your managers.`,`No encontramos una solicitud abierta ${ref}. Tu mensaje se envió a tus gerentes.`),{kind:'confirm'}); notifyStaff(p,m); }
function anonOpenFor(p){ return S.pulses.find(x=>x.anon&&x.status==='open'&&x.locs.some(l=>p.locs.includes(l))&&!x.answered.includes(p.id)); }
function anonByText(p,m,pu){ m.matched={how:'anon'}; const tok=Object.values(S.links).find(l=>l.pid===p.id&&l.kind==='anon'&&l.ref===pu.id)?.tok||mkLink(p.id,'anon',pu.id,7);
  sendText(p.id,LL(p.lang,`Check-in answers by text can’t be anonymous, so this wasn’t counted. Answer privately here: ${linkUrl(tok)}`,`Las respuestas por mensaje no pueden ser anónimas, así que no se contó. Responde en privado aquí: ${linkUrl(tok)}`),{kind:'confirm',link:tok}); }
function doStop(p,m){ m.matched={how:'keyword',what:'stop'}; p.consent='withdrawn'; p.consentDay=S.day; p.consentVia='STOP';
  S.reqs.filter(r=>r.pid===p.id).forEach(r=>r.active=false); delete S.clar[p.id];
  addMsg({pid:p.id,dir:'event',ev:{k:'optout'}});
  sendText(p.id,LL(p.lang,`${ORGN()}: You’re unsubscribed and won’t get more texts from this number. Reply START to rejoin.`,`${ORGN()}: Te diste de baja y no recibirás más mensajes de este número. Responde START para volver.`),{kind:'stop'}); }
function doStart(p,m){ m.matched={how:'keyword',what:'start'}; p.consent='granted'; p.consentDay=S.day; p.consentVia='START'; if(p.phoneVerified) p.status='active';
  addMsg({pid:p.id,dir:'event',ev:{k:'optin'}});
  sendText(p.id,LL(p.lang,`${ORGN()}: You’re back on team texts. Reply STOP anytime to opt out, HELP for help.`,`${ORGN()}: Volviste a recibir mensajes del equipo. Responde STOP para darte de baja o AYUDA para ayuda.`),{kind:'start'}); }
function doHelp(p,m){ m.matched={how:'keyword',what:'help'}; const tok=mkLink(p.id,'hub',null,30);
  sendText(p.id,LL(p.lang,`${ORGN()} team texts. Reply to reach your managers. Your page – share feedback, contact the owner privately, rewards: ${linkUrl(tok)} Reply STOP to opt out. Msg & data rates may apply.`,`Mensajes del equipo de ${ORGN()}. Responde para hablar con tus gerentes. Tu página – comentarios, contacto privado con la dueña, recompensas: ${linkUrl(tok)} Responde STOP para darte de baja. Pueden aplicar tarifas.`),{kind:'help',link:tok}); }
function smsWelcome(p){ return LL(p.lang,`${ORGN()}: You’re set! You’ll get team texts from this number. Reply anytime to reach your managers. Msg frequency varies. Msg & data rates may apply. Reply HELP for help, STOP to opt out.`,`${ORGN()}: ¡Listo! Recibirás mensajes del equipo desde este número. Responde cuando quieras para hablar con tus gerentes. La frecuencia varía. Pueden aplicar tarifas de mensajes y datos. Responde AYUDA para ayuda o STOP para darte de baja.`); }
function sendInvite(p,o={}){ if(p.consent==='withdrawn'||p.consent==='declined'||p.status==='deactivated') return false;
  Object.values(S.links).filter(l=>l.pid===p.id&&l.kind==='enroll'&&!l.used).forEach(l=>l.dead=true);
  const tok=mkLink(p.id,'enroll',null,7); p.invite={status:'active',day:S.day,tok}; p.inviteSent=S.day; if(p.status!=='active') p.status='invited';
  const by=P(o.by)||P(S.org.owner); const nm=first(by.name); const lang=p.lang;
  const txt=LL(lang,`${ORGN()}: Hi ${first(p.name)}, ${nm} added you to team texts. Confirm your info and choose English or Spanish: ${linkUrl(tok)} (expires in 7 days). No app needed.`,`${ORGN()}: Hola ${first(p.name)}, ${nm} te agregó a los mensajes del equipo. Confirma tus datos y elige inglés o español: ${linkUrl(tok)} (vence en 7 días). No necesitas app.`)+(o.welcome?LL(lang,' Welcome to the team!',' ¡Bienvenido al equipo!'):'');
  const m=sendText(p.id,txt,{kind:'invite',author:o.by||null,link:tok}); return m.st!=='failed'; }
/* texts that follow an event (goal reached, gift card, etc.) */
function notify(pid,n){ const p=P(pid); if(!textable(p)) return null; const l=p.lang; const o={kind:n.type}; let s=null, tok;
  switch(n.type){
    case 'goal': tok=mkLink(pid,'reward',null,7); o.link=tok; s=LL(l,`${headFor(p)}: Goal reached! $${n.amt} was added to your rewards. View or redeem: ${linkUrl(tok)}`,`${headFor(p)}: ¡Meta lograda! Se sumaron $${n.amt} a tus recompensas. Ver o canjear: ${linkUrl(tok)}`); break;
    case 'goalnew': { const g=S.goals.filter(x=>x.eligible.includes(pid)&&x.status==='active').pop(); tok=mkLink(pid,'goal',g?g.id:null,30); o.link=tok; s=LL(l,`${headFor(p)}: New team goal – ${n.title.en}. Earn $${g?g.reward:''} by ${g?shortDate(g.end,l):''}. Details: ${linkUrl(tok)}`,`${headFor(p)}: Nueva meta del equipo – ${n.title.es}. Gana $${g?g.reward:''} antes del ${g?shortDate(g.end,l):''}. Detalles: ${linkUrl(tok)}`); break; }
    case 'issued': s=n.meal?LL(l,`${ORGN()}: Your $${n.amt} meal credit was applied. Enjoy!`,`${ORGN()}: Se aplicó tu crédito de comida de $${n.amt}. ¡Buen provecho!`):LL(l,`${ORGN()}: Your $${n.amt} ${n.brand||''} gift card was sent${n.dest==='email'?' to your email':''}. Code (sample): GC-${String(Math.floor(hsh(pid+S.seq)*1e6)).padStart(6,'0')}`,`${ORGN()}: Se envió tu tarjeta de regalo ${n.brand||''} de $${n.amt}${n.dest==='email'?' a tu correo':''}. Código (ejemplo): GC-${String(Math.floor(hsh(pid+S.seq)*1e6)).padStart(6,'0')}`); break;
    case 'failed': tok=mkLink(pid,'reward',null,7); o.link=tok; s=LL(l,`${ORGN()}: Your gift card couldn’t be delivered. Your balance wasn’t charged. Try again: ${linkUrl(tok)}`,`${ORGN()}: No se pudo entregar tu tarjeta de regalo. No se descontó tu saldo. Intenta de nuevo: ${linkUrl(tok)}`); break;
    case 'ysw': s=LL(l,`${headFor(p)}: You said, we did – ${n.title.en||''}`,`${headFor(p)}: Ustedes dijeron, nosotros hicimos – ${n.title.es||n.title.en||''}`); break;
    case 'esc': { const f=n.f||S.feedback.filter(x=>x.pid===pid&&fbOpen(x)).pop(); s=LL(l,`${ORGN()}: ${first(OWNER().name)} is now handling case ${f?f.ref:''}.`,`${ORGN()}: ${first(OWNER().name)} ahora atiende el caso ${f?f.ref:''}.`); if(f) o.ctx={type:'feedback',id:f.id,ref:f.ref}; o.restricted=!!(f&&f.restricted); break; }
    case 'reward': tok=mkLink(pid,'reward',null,7); o.link=tok; s=LL(l,`${ORGN()}: Good news – your $${n.amt} reward${n.from?' from '+first(P(n.from).name):''} was approved. View or redeem: ${linkUrl(tok)}`,`${ORGN()}: Buenas noticias – se aprobó tu recompensa de $${n.amt}${n.from?' de '+first(P(n.from).name):''}. Ver o canjear: ${linkUrl(tok)}`); break;
    case 'recog': { const r=S.recogs.find(x=>x.id===n.rid); if(r) s=recogSms(r,p,false); break; }
  }
  return s?sendText(pid,s,o):null; }
function recogSms(r,p,withReward,tok){ const l=p.lang; const fromN=first(P(r.from).name);
  const note=r.note?(r.note.lang===l?r.note.text:(r.noteTr&&r.noteTr.lang===l?r.noteTr.text:r.note.text)):null;

function cleanEmail(body){ const lines=String(body||'').replace(/\r/g,'').split('\n'); const out=[]; const rm={sig:0,quote:0};

function processEmailReply(e,form){
  const steps=[]; const ok=(l)=>steps.push({ok:true,l}), no=(l)=>steps.push({ok:false,l}); const res={steps,status:'',day:S.day,t:S.t,from:form.from,body:form.body,attach:!!form.attach,ooo:!!form.ooo};
  const sender=S.people.find(p=>p.workEmail&&p.workEmail.toLowerCase()===String(form.from).toLowerCase());
  const done=(status,bounce)=>{ res.status=status; e.results.push(res); if(bounce&&sender) mkEmail(sender.id,'bounce',{re:e.id,why:status,pid:e.pid}); return res; };
  if(form.ooo||/out of office|automatic reply|auto-reply|respuesta automática|fuera de la oficina/i.test(form.body)){ no(X('Automatic reply detected (out-of-office header). Ignored — no text sent and no bounce, so mail systems can’t loop.','Respuesta automática detectada (encabezado de fuera de oficina). Se ignoró: no se envió mensaje ni rebote, así no hay ciclos de correo.')); return done('auto',false); }
  if(!e.canReply){ no(e.kind==='sensitive'?X('Direct replies are turned off for private items.','Las respuestas directas están desactivadas para asuntos privados.'):X('This email isn’t tied to one conversation, so the reply can’t be routed safely.','Este correo no corresponde a una sola conversación; la respuesta no se puede dirigir con seguridad.')); return done(e.kind==='sensitive'?'sensitive':'ambiguous',true); }
  ok(X(`Routed by reply address to ${P(e.pid).name}’s conversation (${convRef(e.pid)})`,`Dirigido por la dirección de respuesta a la conversación de ${P(e.pid).name} (${convRef(e.pid)})`));
  if(!sender){ no(X(`Sender ${form.from} isn’t a Plum Crew user. Rejected.`,`El remitente ${form.from} no es usuario de Plum Crew. Rechazado.`)); return done('unauthorized',true); }
  if(sender.id!==e.to||!staffCanSee(sender.id,e.pid)){ no(X(`${sender.name} doesn’t have access to this conversation. Rejected.`,`${sender.name} no tiene acceso a esta conversación. Rechazado.`)); return done('noaccess',true); }
  const p=P(e.pid); ok(X(`Sender verified: ${sender.name}`,`Remitente verificado: ${sender.name}`));
  if(!(S.prefs[sender.id]||{}).replies){ no(X('Direct email replies are off in this person’s preferences.','Las respuestas por correo están desactivadas en sus preferencias.')); return done('disabled',true); }
  if(!textable(p)){ no(X(`${first(p.name)} can’t receive texts (${exclL(eligibleFor(p))}). Nothing was sent.`,`${first(p.name)} no puede recibir mensajes (${exclL(eligibleFor(p))}). No se envió nada.`)); return done('closed',true); }
  if(form.attach){ no(X('Attachments can’t be texted. Nothing was sent — reply without the attachment, or share files from the dashboard.','Los archivos adjuntos no se pueden enviar por mensaje. No se envió nada: responde sin el adjunto o compártelo desde el panel.')); return done('attachment',true); }
  const cl=cleanEmail(form.body);
  if(!cl.text){ no(X('No message text found after removing the signature and quoted history.','No quedó texto después de quitar la firma y el historial citado.')); return done('empty',true); }
  ok(X(`Removed ${cl.rm.sig} signature line(s) and ${cl.rm.quote} quoted line(s)`,`Se quitaron ${cl.rm.sig} línea(s) de firma y ${cl.rm.quote} línea(s) citadas`));
  const key=e.pid+'|'+cl.text.toLowerCase();
  if(S.emailSeen.includes(key)){ no(X('Duplicate of a reply already texted. Ignored so the employee doesn’t get it twice.','Duplicado de una respuesta ya enviada. Se ignoró para que no la reciba dos veces.')); return done('duplicate',false); }
  S.emailSeen.push(key);
  const lm=lastIn(e.pid); const ctx=lm&&lm.ctx?lm.ctx:null;
  if(p.lang!==(sender.lang||'en')){
    const r=translate(cl.text,sender.lang||'en',p.lang);
    const m=addMsg({pid:p.id,dir:'out',via:'email',author:sender.id,kind:'reply',text:{lang:sender.lang||'en',text:cl.text},st:'review',ctx,tr:r.ok?{lang:p.lang,text:r.text,quality:r.quality}:null,trErr:!r.ok});
    ok(X(`${first(p.name)} reads ${langName(p.lang)}. The draft was sent to Plum Crew for translation review — it isn’t texted until someone approves it.`,`${first(p.name)} lee en ${langName(p.lang)}. El borrador pasó a revisión de traducción en Plum Crew; no se envía hasta aprobarlo.`));
    mkEmail(sender.id,'review',{pid:p.id,msg:m.id}); res.text=cl.text; res.msg=m.id; return done('review',false); }
  const m=staffReply(p.id,sender.id,cl.text,{via:'email',ctx}); res.text=cl.text; res.msg=m.id;
  ok(X(`Texted to ${first(p.name)} from ${BIZ()} — your email address stays private`,`Enviado por mensaje a ${first(p.name)} desde ${BIZ()}; tu correo no se muestra`));
  if(ctx&&ctx.type==='feedback') ok(X(`Recorded on case ${ctx.ref}. Its status didn’t change — email replies never resolve a case.`,`Registrado en el caso ${ctx.ref}. Su estado no cambió: las respuestas por correo nunca resuelven un caso.`));
  return done('sent',false); }

  const me=ME();
  const tg=(c,on,l)=>`<label class="chk"><input type="checkbox" data-c="${c}" ${on?'checked':''}> ${l}</label>`;
  return `<aside class="demo-panel" aria-label="${X('Demo controls','Controles de demo')}" style="top:120px;bottom:auto">
   <h3>${X('Simulate & journeys','Simular y recorridos')} <button class="btn sm" style="width:auto" data-a="demoToggle" aria-label="${X('Close','Cerrar')}">${icon('x',13)}</button></h3>
   <div class="def">${X('Not part of the product. Nothing is really texted or emailed.','No es parte del producto. No se envía ningún mensaje ni correo real.')}</div>
   <div class="dsec"><div class="dl">${X('Scenario','Escenario')}</div><select class="in" data-c="scenario"><option value="group" ${S.scenario==='group'?'selected':''}>Mesa Verde Kitchen — 5 ${X('locations','tiendas')}</option><option value="single" ${S.scenario==='single'?'selected':''}>Casa Lupita — 1 ${X('location','tienda')}</option><option value="new" ${S.scenario==='new'?'selected':''}>${X('New restaurant (empty)','Restaurante nuevo (vacío)')}</option></select></div>
   <div class="dsec"><div class="dl">${X('Simulate','Simular')}${me?` · ${esc(first(me.name))}`:''}</div>
    ${tg('smsFail',S.demo.smsFail,X('Delivery failure: the next text fails','Falla de entrega: el próximo mensaje falla'))}
    ${tg('trFail',S.demo.trFail,X('Translation failure: the next translation fails','Falla de traducción: la próxima traducción falla'))}
    ${tg('giftFail',S.demo.giftFail,X('Next gift card delivery fails','Falla la próxima tarjeta de regalo'))}
    ${tg('tcDelay',S.demo.tcDelay,X('Timeclock data delayed','Datos del reloj atrasados'))}
    ${me?`<button class="btn" style="margin-top:6px" data-a="simOptOut">${icon('phone',14)} ${X(`Opt-out: ${first(me.name)} texts STOP`,`Baja: ${first(me.name)} envía STOP`)}</button>
    <button class="btn" data-a="simAmbig">${icon('chat',14)} ${X(`Ambiguous reply from ${first(me.name)}`,`Respuesta ambigua de ${first(me.name)}`)}</button>`:''}
    ${S.org.setupDone?`<button class="btn" data-a="simUnauth">${icon('mail',14)} ${X('Unauthorized email reply','Respuesta de correo no autorizada')}</button>`:''}
    <button class="btn" data-a="advance">${icon('fwd',14)} ${X('Advance 1 day','Avanzar 1 día')} · ${fd(S.day,null,{month:'short',day:'numeric'})}</button>
    <button class="btn" data-a="resetScn">${icon('reset',14)} ${X('Reset demo','Restablecer demo')}</button>
   </div>
   <div class="dsec"><div class="dl">${X('Guided journeys','Recorridos guiados')}</div>
    ${JOURNEYS.map(j=>`<button class="btn" data-a="journey" data-x="${j.n}" style="height:auto;padding:8px 10px;text-align:left;white-space:normal;line-height:1.3"><b class="mono" style="min-width:22px">${j.n}</b> ${S.lang==='es'?j.es:j.en}</button>`).join('')}
   </div>
   <div class="dsec def">${X('Simulated here: text messages, delivery receipts, verification codes, email, translation, POS roster and timeclock feeds, funding and gift card payments, usage estimates, and historical results.','Simulado aquí: mensajes, confirmaciones de entrega, códigos, correo, traducción, datos de POS y reloj, fondos y tarjetas, estimaciones de uso e historial.')}</div>
  </aside>`;
}

function jSet(view,as,emp){ S.demo.view=view==='owner'||view==='manager'?'dash':view; if(view==='owner'||view==='manager') S.demo.as=view; if(as) S.demo.as=as; if(emp) S.demo.emp=emp; if(S.demo.as==='manager'&&!S.demo.mgr) S.demo.mgr=managerIdDefault(); UI.demoOpen=false; S.drawer=null; window.scrollTo(0,0); }
function jNew(pred){ return S.msgs.some(m=>m.seq>S.demo.jstart&&pred(m)); }
function jUpd(tpl){ return S.updates.filter(u=>u.tpl===tpl&&u.status==='sent'&&u.created>=S.demo.jstart).pop(); }
function latestLink(pid,kind){ const ls=Object.values(S.links).filter(l=>l.pid===pid&&l.kind===kind&&!l.dead); return ls[ls.length-1]; }

function jMakeSecondQuestion(){ if(S.updates.some(u=>u.tpl==='inventory')) return; const u=up(uid('u'),nextRef(),'question','m1','en',{t:'Who can stay late Friday for inventory?',b:'We need two people until 11 pm. Reply if you can stay.'},['s1'],'all',S.day,S.day+2); u.tpl='inventory'; u.created=S.seq; u.tr={lang:'es',t:'¿Quién puede quedarse tarde el viernes para el inventario?',b:'Necesitamos a dos personas hasta las 11 pm. Responde si puedes quedarte.',quality:'known'}; S.updates.push(u); deliver(u); }
function guidePanel(){
  const j=S.demo.journey&&JOURNEYS.find(x=>x.n===S.demo.journey); if(!j||!S.demo.guide) return '';
  if(S.demo.guideMin) return `<button class="demo-fab" style="left:auto;right:16px" data-a="guideMin">${icon('book',14)} ${X('Journey','Recorrido')} ${j.n} · ${X('show steps','ver pasos')}</button>`;
  return `<aside class="guide" aria-label="${X('Guided journey','Recorrido guiado')}"><div class="gh"><div style="flex:1"><div class="def" style="font-weight:700;letter-spacing:.04em;text-transform:uppercase">${X('Journey','Recorrido')} ${j.n} · DEMO</div><b style="font-size:16px;line-height:1.3;display:block;margin-top:2px">${S.lang==='es'?j.es:j.en}</b></div><button class="btn sm" data-a="guideMin" aria-label="${X('Minimize','Minimizar')}">${icon('left',13)}</button><button class="btn sm" data-a="guideClose" aria-label="${X('Close','Cerrar')}">${icon('x',13)}</button></div>
   <div class="gb"><ol>${j.steps.map((s,i)=>{ const ok=s.done?s.done():!!S.jdone[i]; return `<li class="${ok?'ok':''}"><span class="n">${ok?icon('check',12):i+1}</span><div class="gt">${S.lang==='es'?s.es:s.en}<div style="margin-top:6px"><button class="btn sm" data-a="jStep" data-x="${i}">${icon('right',12)} ${X('Show me','Muéstrame')}</button></div></div></li>`; }).join('')}</ol>
   <p class="def" style="margin-top:12px">${X('“Show me” switches views and fills in the next action. You still press Send.','“Muéstrame” cambia de vista y llena el siguiente paso. Tú presionas Enviar.')}</p></div></aside>`;
}

function drawerHtml(){ if(!S.drawer) return ''; const f=DRAWERS[S.drawer.k]; return f?`<div class="scrim" data-a="closeDrawer"></div><aside class="drawer" role="dialog" aria-modal="true">${f(S.drawer)}</aside>`:''; }
function modalHtml(){ return UI.modal?`<div class="modal-bg" data-a="modalBg"><div class="modal" role="dialog" aria-modal="true">${UI.modal()}</div></div>`:''; }

    <div class="field"><label class="label" for="obName">${X('Restaurant name','Nombre del restaurante')}</label><input id="obName" class="in ${o.err&&!o.name.trim()?'err':''}" data-bind="ob.name" value="${esc(o.name)}" placeholder="${X('e.g., Casa Lupita Taquería','p. ej., Casa Lupita Taquería')}">${o.err&&!o.name.trim()?`<div class="inline-err">${X('Enter your restaurant name.','Escribe el nombre de tu restaurante.')}</div>`:''}</div>
    <div class="field"><span class="label">${X('How many locations?','¿Cuántas tiendas?')}</span><div class="chips">${[1,2,3,5].map(n=>`<button class="chip ${o.nlocs===n?'on':''}" data-a="obSet" data-x="nlocs|${n}">${n}</button>`).join('')}<label class="small row" style="gap:6px">${X('Other','Otro')} <input class="in" type="number" min="1" max="20" style="width:80px;min-height:38px" data-bind="ob.nlocs" data-num="1" data-rerender="1" value="${o.nlocs}"></label></div><div class="def" style="margin-top:4px">${X('Plum Crew is built for 1–20 locations.','Plum Crew es para 1 a 20 tiendas.')}</div></div>
    ${o.nlocs>1?`<div class="field"><span class="label">${X('Location names','Nombres de las tiendas')}</span><div class="grid g2">${Array.from({length:Math.min(20,o.nlocs)},(_,i)=>`<input class="in" data-bind="ob.locNames.${i}" value="${esc(o.locNames[i]||'')}" placeholder="${X('Location','Tienda')} ${i+1}">`).join('')}</div></div>`:`<div class="field"><label class="label" for="obLoc">${X('Location name (optional)','Nombre de la tienda (opcional)')}</label><input id="obLoc" class="in" data-bind="ob.locNames.0" value="${esc(o.locNames[0]||'')}"></div>`}`;
  } else if(o.step===2){
    const r=o.row, e=o.rowErr;
    b=`<h2 style="margin:0 0 6px">${X('Add your team','Agrega a tu equipo')}</h2><p class="sub" style="margin:0 0 14px">${X('We’ll text each person a personal invitation. No app download needed.','Le mandaremos a cada persona una invitación personal por mensaje. No necesitan descargar nada.')}</p>
    <div class="card" style="padding:16px;background:#fafafc"><div class="grid" style="grid-template-columns:2fr 1.4fr 1.6fr 1fr auto;align-items:end;gap:10px">

function ackStats(locs,days){ let a=0,b=0; S.updates.filter(u=>u.mode==='important'&&u.status==='sent'&&u.locs.some(l=>locs.includes(l))&&S.day-u.sentDay<days).forEach(u=>{ const c=uCounts(u,locs); a+=c.ack; b+=c.delivered+c.unknown; }); return {a,b}; }

function consentLine(p){
  if(p.consent==='granted') return X(`Agreed ${p.consentVia==='START'?'by texting START':'during enrollment'} · ${fd(p.consentDay)}`,`Aceptó ${p.consentVia==='START'?'al enviar START':'al inscribirse'} · ${fd(p.consentDay)}`);
  if(p.consent==='withdrawn') return X(`Withdrawn — replied ${p.consentVia||'STOP'} on ${fd(p.consentDay)}`,`Retirado: respondió ${p.consentVia||'STOP'} el ${fd(p.consentDay)}`);
  if(p.consent==='declined') return X(`Declined during enrollment · ${fd(p.consentDay)}`,`Rechazó al inscribirse · ${fd(p.consentDay)}`);
  return X('Not asked yet — asked during enrollment','Aún no se pregunta: se pide al inscribirse');
}

DRAWERS.recog=function(d){

/* ============ SMS length & segments ============ */
const GSM7='@£$¥èéùìòÇ\nØø\rÅåΔ_ΦΓΛΩΠΨΣΘΞÆæßÉ !"#¤%&\'()*+,-./0123456789:;<=>?¡ABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÑÜ§¿abcdefghijklmnopqrstuvwxyzäöñüà';
const GSM7X='^{}\\[~]|€';
function segInfo(s){ s=String(s||''); let len=0; const bad=new Set();
  for(const ch of s){ if(GSM7.includes(ch)) len++; else if(GSM7X.includes(ch)) len+=2; else bad.add(ch); }
  if(!bad.size) return {enc:'GSM-7',chars:len,segs:len<=160?1:Math.ceil(len/153),per:len<=160?160:153,bad:[]};
  const u=[...s].reduce((a,c)=>a+(c.codePointAt(0)>0xFFFF?2:1),0); return {enc:'Unicode (UCS-2)',chars:u,segs:u<=70?1:Math.ceil(u/67),per:u<=70?70:67,bad:[...bad].slice(0,6)}; }
function segLine(s){ const g=segInfo(s); return `<span class="segm">${g.chars} ${X('chars','caracteres')} · ${g.enc} · ${g.segs} ${X(g.segs===1?'segment':'segments',g.segs===1?'segmento':'segmentos')}${g.segs>1?` (${g.per} ${X('per part','por parte')})`:''}</span>${g.bad.length?`<div class="def">${X('Unicode because of','Unicode por')} ${g.bad.map(c=>`<span class="mono" style="background:var(--grayL);border-radius:4px;padding:0 5px">${esc(c===' '?'␣':c)}</span>`).join(' ')} — ${X('accents like á, í, ó, ú switch the text to Unicode, so each segment holds 70 characters instead of 160. Curly quotes and dashes are converted automatically.','acentos como á, í, ó, ú cambian el texto a Unicode: cada segmento lleva 70 caracteres en vez de 160. Las comillas curvas y guiones se convierten automáticamente.')}</div>`:''}`; }

function updateDetail(u){

  </div>`;
