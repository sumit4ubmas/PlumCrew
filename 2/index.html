<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plum Crew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --top:#17171c; --top2:#24242b; --topText:#e9e9ef; --topMuted:#9a9aa8;
  --purple:#5b2fd6; --purpleD:#4822b3; --purpleL:#efe9fd; --purpleM:#d9ccfb;
  --bg:#f3f3f6; --card:#fff; --line:#e3e3ea; --line2:#eeeef3;
  --text:#1b1b22; --muted:#5b5d6b; --faint:#80828f;
  --red:#b3261e; --redL:#fdecea; --amber:#935400; --amberL:#fff3dc;
  --green:#1b7340; --greenL:#e5f4ea; --blue:#1d5bb5; --blueL:#e7effb;
  --grayL:#f0f0f4;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--purple)}
.mono{font-family:var(--mono)}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top bar */
.top{background:var(--top);color:var(--topText);height:52px;display:flex;align-items:center;gap:14px;padding:0 16px;position:sticky;top:0;z-index:30}
.logo{width:30px;height:30px;border-radius:8px;background:var(--purple);display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none}
.brand{font-weight:600;font-size:15px;white-space:nowrap}
.top .sep{width:1px;height:20px;background:#3a3a44}
.top .crumb{color:var(--topMuted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .grow{flex:1}
.top .date{font-family:var(--mono);color:var(--topMuted);font-size:13px;white-space:nowrap}
.avatar{width:32px;height:32px;border-radius:50%;background:#2b63d9;color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.topbtn{background:var(--top2);border:1px solid #34343e;color:var(--topText);border-radius:8px;height:32px;padding:0 10px;display:flex;align-items:center;gap:6px;font-size:13px}
.topbtn:hover{background:#2e2e37}
.ctx{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--topText);white-space:nowrap}
.ctx .pill{background:#2d2d36;border:1px solid #3c3c47;border-radius:999px;padding:3px 10px}

/* demo strip */
.demo{background:#fbfaff;border-bottom:1px solid var(--purpleM);padding:8px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.demo .tag{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--purpleD);font-weight:600;background:var(--purpleL);border:1px solid var(--purpleM);padding:2px 8px;border-radius:4px}
.demo label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.demo select{height:32px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 8px;font-size:13px;min-width:0}
.demo select:disabled{background:var(--grayL);color:var(--faint)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:5px 12px;font-size:13px;min-height:30px}
.seg button.on{background:var(--purple);color:#fff}
.dbtn{height:32px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:0 10px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.dbtn:hover{border-color:var(--purple);color:var(--purpleD)}
.dbtn.warn{color:var(--red)}
.chk{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.chk input{accent-color:var(--purple);width:16px;height:16px}
.demo-toggle{display:none}
@media (max-width:760px){
  .demo-toggle{display:inline-flex}
  .demo.collapsed > :not(.demo-head){display:none}
  .top .crumb,.top .sep,.top .date,.ctx .pill.hide-m,.top .brand,.hide-s{display:none}
  .top{gap:8px;padding:0 10px}
  .ctx{min-width:0;flex:1}.ctx .pill{overflow:hidden;text-overflow:ellipsis;font-size:12px}
  .top .grow{display:none}
}
.demo-head{display:flex;align-items:center;gap:10px}

/* layout */
.wrap{max-width:1320px;margin:0 auto;padding:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px}
.panel-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.panel-h h1,.panel-h h2{margin:0;font-size:17px;font-weight:600}
.panel-b{padding:16px 18px}
.ico{width:24px;height:24px;border-radius:6px;background:var(--purpleL);color:var(--purple);display:grid;place-items:center;flex:none}
.ico svg{width:14px;height:14px}
.sub{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line2);align-items:center}
.tab{border:0;background:transparent;border-radius:999px;padding:8px 14px;font-weight:500;color:#3a3b46;display:inline-flex;align-items:center;gap:6px;min-height:38px}
.tab:hover{background:var(--grayL)}
.tab.on{background:var(--purple);color:#fff}
.tab .cnt{font-family:var(--mono);font-size:11px;background:var(--redL);color:var(--red);border-radius:999px;padding:0 6px}
.tab.on .cnt{background:#fff;color:var(--purpleD)}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:0 14px;min-height:38px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:#c9c9d4}
.btn.p{background:var(--purple);border-color:var(--purple);color:#fff}
.btn.p:hover{background:var(--purpleD)}
.btn.d{color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.btn.link{border:0;background:none;color:var(--purple);padding:0 4px;min-height:auto}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.g6{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2,.g3{grid-template-columns:1fr}.g6{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:10px}}

/* KPI card like reference */
.kpi{border:1px solid var(--line);border-top:3px solid var(--c,var(--purple));border-radius:8px;padding:10px 12px;background:#fff;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
button.kpi:hover{box-shadow:0 1px 0 var(--line),0 4px 14px rgba(20,20,40,.06)}
.kpi .lab{font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:6px}
.kpi .dot{width:16px;height:16px;border-radius:4px;background:var(--cl,var(--purpleL));display:grid;place-items:center}
.kpi .dot i{width:6px;height:6px;border-radius:50%;background:var(--c,var(--purple))}
.kpi .val{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:-.02em}
.kpi .foot{display:flex;justify-content:space-between;gap:6px;border-top:1px solid var(--line2);padding-top:6px;margin-top:2px}
.kpi .foot div{display:flex;flex-direction:column;min-width:0}
.kpi .foot small{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.kpi .foot span{font-family:var(--mono);font-size:12.5px}
.flag{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:4px;margin-left:auto;white-space:nowrap}

/* status pills: text + color */
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.need{background:var(--redL);color:var(--red)}
.st.prog{background:var(--amberL);color:var(--amber)}
.st.done{background:var(--greenL);color:var(--green)}
.st.info{background:var(--blueL);color:var(--blue)}
.st.mute{background:var(--grayL);color:var(--muted)}
.st.pur{background:var(--purpleL);color:var(--purpleD)}

/* table */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-weight:600;font-size:12.5px;color:#3d3e4a;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fafafc}
.tbl td{padding:12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#faf9ff}
.tbl .num{font-family:var(--mono);text-align:right;white-space:nowrap}
.tbl th.num{text-align:right;font-family:var(--sans)}
.idx{font-family:var(--mono);color:var(--faint);font-size:12px}

/* list items */
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line2)}
.item:last-child{border-bottom:0}
.item .t{font-weight:600}
.item .grow{flex:1;min-width:0}
.alert{border:1px solid;border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.alert.r{background:var(--redL);border-color:#f3c5c1;color:#7c1a14}
.alert.a{background:var(--amberL);border-color:#f0d7a6;color:#6a3d00}
.alert.b{background:var(--blueL);border-color:#c5d7f3;color:#173f7a}
.alert.g{background:var(--greenL);border-color:#bfe3cc;color:#135530}
.alert .grow{flex:1;min-width:200px}
.card{border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff}
.card h3{margin:0 0 8px;font-size:14.5px}
.label{font-size:12px;font-weight:600;color:#3d3e4a;margin:0 0 6px;display:block}
.field{margin-bottom:14px}
input.in,textarea.in,select.in{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff;min-height:40px}
textarea.in{resize:vertical;min-height:84px}
input.in:focus,textarea.in:focus,select.in:focus{outline:2px solid var(--purpleM);border-color:var(--purple)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;min-height:38px;font-size:13.5px}
.chip.on{background:var(--purpleL);border-color:var(--purple);color:var(--purpleD);font-weight:600}
.chip:disabled{opacity:.5;cursor:not-allowed}
.meter{height:8px;border-radius:999px;background:var(--grayL);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.bar-row{display:grid;grid-template-columns:110px 1fr 60px;gap:10px;align-items:center;font-size:13px;margin:6px 0}
.demo-badge{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.05em;color:var(--purpleD);background:var(--purpleL);border:1px dashed var(--purple);border-radius:4px;padding:1px 6px;white-space:nowrap}
.est{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.05em;color:var(--amber);background:var(--amberL);border:1px dashed var(--amber);border-radius:4px;padding:1px 6px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.step{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--grayL);font-size:13px;color:var(--muted)}
.step b{width:24px;height:24px;border-radius:50%;background:#fff;display:grid;place-items:center;font-family:var(--mono);font-size:12px}
.step.on{background:var(--purpleL);color:var(--purpleD);font-weight:600}
.step.on b{background:var(--purple);color:#fff}
.step.ok b{background:var(--green);color:#fff}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
@media (max-width:960px){.two{grid-template-columns:1fr}}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
.msg{padding:10px 12px;border-radius:10px;background:var(--grayL);margin:8px 0;max-width:90%}
.msg.me{background:var(--purpleL);margin-left:auto}
.msg .who{font-size:12px;color:var(--muted);margin-bottom:2px;display:flex;gap:6px;flex-wrap:wrap}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.tl div{position:relative;font-size:13px;margin:6px 0;color:var(--muted)}
.tl div::before{content:"";position:absolute;left:-19px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--purple)}
.back{border:0;background:none;color:var(--purple);font-weight:600;padding:6px 0;display:inline-flex;align-items:center;gap:4px;min-height:36px}

/* phone / employee */
.emp-stage{display:flex;gap:24px;justify-content:center;align-items:flex-start;padding:10px 0 30px}
.phone{width:390px;max-width:100%;background:#fafafd;border:1px solid #d6d6df;border-radius:34px;box-shadow:0 20px 50px rgba(20,20,40,.12);overflow:hidden;display:flex;flex-direction:column;height:800px;position:relative}
.ph-top{background:var(--top);color:#fff;padding:14px 16px 12px;display:flex;align-items:center;gap:10px}
.ph-top .s{font-size:12px;color:var(--topMuted)}
.ph-body{flex:1;overflow-y:auto;padding:16px}
.ph-nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:#fff}
.ph-nav button{border:0;background:none;padding:8px 2px 10px;min-height:60px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);position:relative}
.ph-nav button svg{width:22px;height:22px}
.ph-nav button.on{color:var(--purple);font-weight:600}
.ph-nav .badge{position:absolute;top:6px;left:calc(50% + 6px);background:var(--red);color:#fff;border-radius:999px;font-size:10px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px}
.langsw{display:inline-flex;border:1px solid #444452;border-radius:999px;overflow:hidden}
.langsw button{border:0;background:transparent;color:#cfd0da;font-size:12px;font-weight:600;padding:6px 10px;min-height:32px}
.langsw button.on{background:#fff;color:var(--top)}
.bell{position:relative;border:0;background:#2b2b34;color:#fff;border-radius:50%;width:36px;height:36px;display:grid;place-items:center}
.bell .badge{position:absolute;top:-2px;right:-2px;background:var(--red);color:#fff;border-radius:999px;font-size:10px;min-width:16px;height:16px;display:grid;place-items:center}
.ecard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.ecard .k{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.ecard .h{font-size:17px;font-weight:600;margin:2px 0 4px;line-height:1.3}
.ecard p{margin:4px 0 12px;color:#3b3c47;font-size:15px}
.ebtn{width:100%;min-height:50px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:16px;font-weight:600}
.ebtn.p{background:var(--purple);border-color:var(--purple);color:#fff}
.ebtn.p:disabled{opacity:.45}
.ebtn + .ebtn{margin-top:8px}
.ph-body h2{font-size:22px;margin:4px 0 6px;line-height:1.25}
.ph-body .lead{font-size:15.5px;color:#3b3c47;margin:0 0 16px}
.bigopt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:14px;background:#fff;padding:16px;font-size:17px;font-weight:600;min-height:60px;margin-bottom:10px}
.bigopt.on{border-color:var(--purple);background:var(--purpleL)}
.bigopt small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.plist{list-style:none;padding:0;margin:0 0 16px}
.plist li{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2);font-size:15px}
.plist li svg{flex:none;color:var(--purple);margin-top:2px}
.qr{width:170px;height:170px;margin:12px auto;display:block;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.prog-dots{display:flex;gap:6px;margin:10px 0}
.prog-dots i{flex:1;height:10px;border-radius:999px;background:var(--grayL)}
.prog-dots i.f{background:var(--purple)}
.shift{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line2)}
.shift .d{width:46px;text-align:center;font-family:var(--mono);font-size:12px;color:var(--muted);line-height:1.2}
.shift .d b{display:block;font-size:17px;color:var(--text)}
.bal{background:var(--top);color:#fff;border-radius:16px;padding:18px;margin-bottom:12px}
.bal .v{font-family:var(--mono);font-size:34px;font-weight:600}
.side-notes{width:320px;flex:none}
.notif{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px}
.notif .nl{width:28px;height:28px;border-radius:7px;background:var(--purple);color:#fff;font-weight:700;font-size:11px;display:grid;place-items:center;flex:none}
.notif .nt{font-size:13.5px}
.notif .nm{font-size:11.5px;color:var(--faint);font-family:var(--mono)}
.sheet-bg{position:absolute;inset:0;background:rgba(15,15,25,.4);display:flex;align-items:flex-end;z-index:5}
.sheet{background:#fff;border-radius:20px 20px 0 0;padding:18px 16px 20px;width:100%;max-height:85%;overflow-y:auto}
.skel{background:linear-gradient(90deg,#eee 25%,#f6f6f6 37%,#eee 63%);background-size:400% 100%;animation:sk 1.2s ease infinite;border-radius:10px}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
@media (max-width:1000px){.side-notes{display:none}}
@media (max-width:520px){
  .emp-stage{padding:0}
  .phone{border-radius:0;border:0;box-shadow:none;height:calc(100vh - 52px);width:100%}
  body.emp .wrap{padding:0}
}

/* modal & toast & guide */
.modal-bg{position:fixed;inset:0;background:rgba(15,15,25,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
.guide{position:fixed;right:0;top:0;bottom:0;width:380px;max-width:100%;background:#fff;border-left:1px solid var(--line);z-index:60;box-shadow:-10px 0 40px rgba(20,20,40,.12);display:flex;flex-direction:column}
.guide ol{margin:0;padding:0;list-style:none;counter-reset:g}
.guide li{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.guide li .n{width:24px;height:24px;border-radius:50%;background:var(--grayL);display:grid;place-items:center;font-family:var(--mono);font-size:12px;flex:none}
.guide li.ok .n{background:var(--green);color:#fff}
.guide li.ok .gt{color:var(--muted)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--top);color:#fff;padding:10px 16px;border-radius:10px;z-index:70;font-size:13.5px;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:92vw}
.preview-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.preview-pair{grid-template-columns:1fr}}
.mini{border:1px solid var(--line);border-radius:18px;background:#fafafd;overflow:hidden}
.mini .mh{background:var(--top);color:#fff;padding:8px 12px;font-size:12px;display:flex;justify-content:space-between}
.mini .mb{padding:12px}
.push{background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:12.5px;display:flex;gap:8px;margin-bottom:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}
.wiz-foot{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line2);padding-top:14px;margin-top:6px;flex-wrap:wrap}
.opt-card{border:1.5px solid var(--line);border-radius:12px;padding:14px;background:#fff;text-align:left;width:100%}
.opt-card.on{border-color:var(--purple);background:#fbf9ff}
.opt-card:disabled{opacity:.7;cursor:not-allowed}
.small{font-size:12.5px}
.muted{color:var(--muted)}

.scrim{position:fixed;inset:0;background:rgba(15,15,25,.35);z-index:59}
.demo-fab{position:fixed;left:16px;bottom:16px;z-index:65;background:#fffbe8;border:1.5px dashed #c58a00;color:#6a4b00;border-radius:999px;padding:10px 16px;font-weight:700;font-size:13.5px;display:flex;gap:8px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.12)}
.demo-panel{position:fixed;left:16px;bottom:66px;z-index:66;width:380px;max-width:calc(100vw - 32px);max-height:calc(100vh - 100px);overflow:auto;background:#fffdf4;border:1.5px dashed #c58a00;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.18);padding:16px}
.demo-panel h3{margin:0 0 4px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.demo-panel .dsec{border-top:1px dashed #e6cf8a;padding-top:10px;margin-top:10px}
.demo-panel .dl{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#7a5a00;margin-bottom:6px}
.demo-panel select,.demo-panel .btn{width:100%}
.demo-panel .btn{justify-content:flex-start;margin-bottom:6px;min-height:36px;font-size:13.5px}
.demo-panel .chk{margin:4px 0;font-size:13px;color:#4a3a10}
.sim{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.04em;color:#7a5a00;background:#fff4cc;border:1px dashed #c58a00;border-radius:4px;padding:1px 6px;white-space:nowrap;vertical-align:middle}
.sms{background:#e9e9ef;border-radius:16px 16px 16px 4px;padding:10px 12px;font-size:13.5px;margin:6px 0}
.sms .sm{font-size:11px;color:var(--faint);margin-bottom:2px;font-family:var(--mono)}
.sms a,.sms button.lk{color:var(--purple);font-weight:700;background:none;border:0;padding:0;text-decoration:underline;cursor:pointer}
.wiz{max-width:760px;margin:0 auto}
.wiz .card{padding:24px}
.trbox{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.trbox .tl2{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;display:flex;gap:6px;align-items:center}
.kept{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.kept span.k{background:var(--grayL);border-radius:6px;padding:1px 7px;font-family:var(--mono);color:#333}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;flex-wrap:wrap}
.seg2 button{border:0;background:transparent;padding:10px 16px;font-size:14px;font-weight:600;min-height:44px;text-align:left}
.seg2 button+button{border-left:1px solid var(--line)}
.seg2 button.on{background:var(--purpleL);color:var(--purpleD)}
.modecards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.modecard{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;text-align:left}
.modecard.on{border-color:var(--purple);background:#fbf9ff}
.modecard b{display:block;font-size:14.5px}
.modecard span{font-size:12.5px;color:var(--muted)}
.funnel{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.funnel div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.funnel small{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.funnel b{font-family:var(--mono);font-size:22px}
.feedtype{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.otp{display:flex;gap:8px;justify-content:center;margin:14px 0}
.otp input{width:48px;height:58px;text-align:center;font-size:24px;font-family:var(--mono);border:1.5px solid var(--line);border-radius:12px}
.pulsebtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.def{font-size:12.5px;color:var(--muted)}
details.adv{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:#fafafc}
details.adv summary{cursor:pointer;font-weight:700;font-size:14px;min-height:28px}
.okbar{background:var(--greenL);border:1px solid #bfe3cc;color:#135530;border-radius:12px;padding:12px 16px;font-size:14px;display:flex;gap:10px;align-items:center}
.inline-err{color:var(--red);font-size:13px;margin-top:4px}
.in.err{border-color:var(--red)!important}
.emp-me{width:36px;height:36px;border-radius:50%;background:#2b63d9;color:#fff;font-weight:700;font-size:13px;border:0}
@media (max-width:900px){.acts,.sum,.tiles,.modecards{grid-template-columns:1fr}.trbox{grid-template-columns:1fr}.funnel{grid-template-columns:repeat(3,1fr)}.feedtype{grid-template-columns:1fr}}
@media (max-width:760px){
 .mnav{position:fixed;top:auto;bottom:0;left:0;right:0;z-index:40;justify-content:space-around;padding:6px;border-top:1px solid var(--line);border-bottom:0}
 .mnav button{flex-direction:column;gap:2px;font-size:12px;padding:6px 10px;flex:1}
 .mnav .crumb2{display:none}
 body.mgmt .wrap{padding-bottom:90px}
 .drawer{width:100%}
 .page-h h1{font-size:22px}
 .demo-fab{bottom:76px}
 .demo-panel{bottom:126px}
}
</style>
</head>

function reservedLoc(loc){ return S.goals.filter(g=>g.loc===loc&&g.status==='active').reduce((a,g)=>a+(g.eligible.filter(p=>g.done[p]==null).length*g.reward),0); }
function availLoc(loc){ return L(loc).budget-spentLoc(loc)-reservedLoc(loc); }
function issuedLoc(loc,m){ m=m??monthOf(S.day); return S.ledger.filter(l=>l.kind==='redeem'&&l.loc===loc&&l.status==='issued'&&monthOf(l.day)===m).reduce((a,l)=>a+l.amt,0); }
function owedLoc(loc){ // earned but not yet issued (what funding must cover)
  const cr=S.ledger.filter(l=>l.kind==='credit'&&l.loc===loc&&l.status==='earned').reduce((a,l)=>a+l.amt,0);
  const rd=S.ledger.filter(l=>l.kind==='redeem'&&l.loc===loc&&l.status==='issued').reduce((a,l)=>a+l.amt,0);
  return Math.max(0,cr-rd);
}
function fundState(loc){ const f=L(loc).funded, need=owedLoc(loc)+reservedLoc(loc); if(f<=0) return 'empty'; if(f<need) return 'low'; return 'ok'; }
function mgrSpent(mid,m){ m=m??monthOf(S.day); return S.recogs.filter(r=>r.from===mid&&r.reward==='approved'&&monthOf(r.day)===m).reduce((a,r)=>a+r.amt,0); }
function approvalNeed(from,loc,amt){ if(!amt) return null; const p=P(from); if(p.perm==='owner') return amt>availLoc(loc)?'budget':null; if(amt>availLoc(loc)) return 'budget'; if(mgrSpent(from)+amt>p.limit) return 'limit'; return null; }
function balance(pid){ let b=0; S.ledger.filter(l=>l.pid===pid).forEach(l=>{ if(l.kind==='credit'&&l.status==='earned') b+=l.amt; if(l.kind==='redeem'&&['pending','issued','waiting','funding'].includes(l.status)) b-=l.amt; }); return b; }

/* ---------- coverage & participation ---------- */
function coverage(locs,days){ const since=S.day-(days||30); const team=crew(locs).filter(p=>p.status!=='deactivated');
  const got=new Set(S.recogs.filter(r=>r.kind!=='peer'&&r.day>since&&team.some(p=>p.id===r.to)).map(r=>r.to));
  const byRole={}; team.forEach(p=>{ byRole[p.role]=byRole[p.role]||{n:0,r:0}; byRole[p.role].n++; if(got.has(p.id)) byRole[p.role].r++; });
  return {team,got,missing:team.filter(p=>!got.has(p.id)),byRole};
}
function participation(locs,days){ const since=S.day-days; const team=crew(locs);
  const joined=team.filter(p=>p.status==='joined'); const active=joined.filter(p=>p.lastActive!=null&&p.lastActive>since); const part=joined.filter(p=>p.acts.some(a=>a.day>since));
  return {team,joined,active,part};
}

/* ---------- feedback ---------- */
function fbOverdue(f){ return ['received','working','reopened'].includes(f.status)&&S.day>f.nextBy; }
function fbOpen(f){ return ['received','working','reopened'].includes(f.status); }
function fbVisible(f){ if(isOwner()) return scope().includes(f.loc); const me=actorId(); if(f.about!=='none'&&f.handler!==me) return false; return P(me).mgrLocs.includes(f.loc); }
function handlerFor(loc,about){ const own=S.org.owner; if(about==='manager'||about==='owner') return own; const m=S.people.find(p=>p.perm==='manager'&&p.mgrLocs.includes(loc)&&p.role==='Store manager')||S.people.find(p=>p.perm==='manager'&&p.mgrLocs.includes(loc)); return S.org.kind==='single'?own:(m?m.id:own); }

/* ---------- goals ---------- */
function recalcGoal(st,g){ if(g.method!=='auto') return; g.eligible.forEach(pid=>{ const sh=(g.shifts&&g.shifts[pid])||[]; let n=0,run=0,best=0; sh.forEach(s=>{ if(s.st==='on_time'||s.st==='fixed'||s.st==='excused_ok'){ n++; run++; best=Math.max(best,run);} else if(s.st==='late'){ run=0; } }); const ok=g.consec?best>=g.target:n>=g.target; if(ok&&g.done[pid]==null) g.done[pid]=st.day; }); }
function goalProgress(g,pid){ if(g.method==='manager') return {n:g.done[pid]!=null?1:0,target:1}; const sh=(g.shifts[pid]||[]); const n=sh.filter(s=>s.st==='on_time'||s.st==='fixed').length; return {n,target:g.target,left:sh.filter(s=>s.st==='upcoming').length}; }
function awardGoals(){ S.goals.forEach(g=>{ if(g.status!=='active') return; recalcGoal(S,g); g.eligible.forEach(pid=>{ if(g.done[pid]!=null&&!S.ledger.some(l=>l.src==='goal'&&l.ref===g.id&&l.pid===pid)){ S.ledger.push({id:uid('L'),pid,kind:'credit',amt:g.reward,src:'goal',ref:g.id,loc:g.loc,status:'earned',day:S.day}); notify(pid,{type:'goal',amt:g.reward}); } }); if(S.day>g.end) g.status='ended'; }); }

    <div class="field"><label class="label" for="obName">${X('Restaurant name','Nombre del restaurante')}</label><input id="obName" class="in ${o.err&&!o.name.trim()?'err':''}" data-bind="ob.name" value="${esc(o.name)}" placeholder="${X('e.g., Casa Lupita Taquería','p. ej., Casa Lupita Taquería')}">${o.err&&!o.name.trim()?`<div class="inline-err">${X('Enter your restaurant name.','Escribe el nombre de tu restaurante.')}</div>`:''}</div>

    ${o.nlocs>1?`<div class="field"><span class="label">${X('Location names','Nombres de las tiendas')}</span><div class="grid g2">${Array.from({length:Math.min(20,o.nlocs)},(_,i)=>`<input class="in" data-bind="ob.locNames.${i}" value="${esc(o.locNames[i]||'')}" placeholder="${X('Location','Tienda')} ${i+1}">`).join('')}</div></div>`:`<div class="field"><label class="label" for="obLoc">${X('Location name (optional)','Nombre de la tienda (opcional)')}</label><input id="obLoc" class="in" data-bind="ob.locNames.0" value="${esc(o.locNames[0]||'')}"></div>`}`;
  } else if(o.step===2){
    const r=o.row, e=o.rowErr;
    b=`<h2 style="margin:0 0 6px">${X('Add your team','Agrega a tu equipo')}</h2><p class="sub" style="margin:0 0 14px">${X('We’ll text each person a personal invitation. No app download needed.','Le mandaremos a cada persona una invitación personal por mensaje. No necesitan descargar nada.')}</p>
    <div class="card" style="padding:16px;background:#fafafc"><div class="grid" style="grid-template-columns:2fr 1.4fr 1.6fr 1fr auto;align-items:end;gap:10px">
      <div><label class="label" for="obEn">${X('Name','Nombre')}</label><input id="obEn" class="in ${e.name?'err':''}" data-bind="ob.row.name" value="${esc(r.name)}" placeholder="Rosa Méndez"></div>
      <div><label class="label" for="obEr">${X('Role','Puesto')}</label><select id="obEr" class="in" data-bind="ob.row.role">${ROLES.map(x=>`<option ${r.role===x?'selected':''} value="${x}">${roleL(x)}</option>`).join('')}</select></div>
      <div><label class="label" for="obEp">${X('Mobile number','Celular')}</label><input id="obEp" class="in ${e.phone?'err':''}" inputmode="tel" data-bind="ob.row.phone" value="${esc(r.phone)}" placeholder="(951) 555-0142"></div>
      <div><label class="label" for="obEl">${X('Language','Idioma')}</label><select id="obEl" class="in" data-bind="ob.row.lang"><option value="es" ${r.lang==='es'?'selected':''}>Español</option><option value="en" ${r.lang==='en'?'selected':''}>English</option></select></div>
      <button class="btn p" data-a="obAddRow">${icon('plus',15)} ${X('Add','Agregar')}</button></div>
      ${e.name||e.phone||e.dup?`<div class="inline-err">${[e.name?X('Enter a name.','Escribe un nombre.'):'',e.phone?X('Enter a 10-digit mobile number.','Escribe un celular de 10 dígitos.'):'',e.dup?X('That number is already on the list.','Ese número ya está en la lista.'):''].filter(Boolean).join(' ')}</div>`:''}
    </div>
    <details class="adv" style="margin-top:12px" ${o.csvRows||o.csv?'open':''}><summary>${icon('upload',14)} ${X('Or paste a roster (name, role, phone, language)','O pega una lista (nombre, puesto, celular, idioma)')}</summary>
      <textarea class="in" style="margin-top:10px;font-family:var(--mono);font-size:13px" rows="5" data-bind="ob.csv" placeholder="Carlos Vega, Line cook, 951-555-0177, es&#10;Emily Park, Server, 951-555-0190, en">${esc(o.csv)}</textarea>
      <div class="row" style="margin-top:8px"><button class="btn sm" data-a="obSample">${X('Use sample roster','Usar lista de ejemplo')}</button><button class="btn sm p" data-a="obParse">${X('Check and add','Revisar y agregar')}</button></div>
      ${o.csvRows?`<div class="def" style="margin-top:8px">${o.csvRows.ok} ${X('added','agregados')}${o.csvRows.bad.length?` · <b style="color:var(--red)">${o.csvRows.bad.length} ${X('need fixing','por corregir')}:</b> ${o.csvRows.bad.map(x=>esc(x)).join('; ')}`:''}</div>`:''}
      <div class="def" style="margin-top:6px">${X('A POS roster sync is optional — you can connect it later in Settings.','Sincronizar con el POS es opcional; puedes conectarlo después en Configuración.')}</div>
    </details>
    <div style="margin-top:14px">${o.emps.length?`<div class="rows">${o.emps.map((p,i)=>`<div class="rowi"><div class="av">${initials(p.name)}</div><div class="grow"><div class="nm">${esc(p.name)}</div><div class="mt">${roleL(p.role)} · ${esc(p.phone)} · ${p.lang==='es'?'Español':'English'}</div></div><button class="btn sm" data-a="obDel" data-x="${i}" aria-label="${X('Remove','Quitar')} ${esc(p.name)}">${icon('x',13)}</button></div>`).join('')}</div>`:`<div class="empty">${X('No one added yet. Add at least one person, or skip and add people later in Team.','Aún no hay nadie. Agrega al menos una persona, o salta y agrégalas después en Equipo.')}</div>`}</div>`;
  } else if(o.step===3){
    b=`<h2 style="margin:0 0 6px">${X('Confirm languages','Confirma los idiomas')}</h2><p class="sub" style="margin:0 0 14px">${X('Each person gets messages in their language. You write once; Plum Crew drafts the translation for you to check.','Cada persona recibe los mensajes en su idioma. Tú escribes una vez; Plum Crew prepara la traducción para que la revises.')}</p>
    ${o.emps.length?`<div class="rows">${o.emps.map((p,i)=>`<div class="rowi"><div class="av">${initials(p.name)}</div><div class="grow"><div class="nm">${esc(p.name)}</div><div class="mt">${roleL(p.role)}</div></div><span class="seg"><button data-a="obLang" data-x="${i}|en" class="${p.lang==='en'?'on':''}">English</button><button data-a="obLang" data-x="${i}|es" class="${p.lang==='es'?'on':''}">Español</button></span></div>`).join('')}</div>`:`<div class="empty">${X('No team members yet — you can skip this step.','Aún no hay equipo; puedes saltar este paso.')}</div>`}
    <p class="def">${X('Employees can change their own language anytime.','Cada persona puede cambiar su idioma cuando quiera.')}</p>`;
  } else if(o.step===4){
    b=`<h2 style="margin:0 0 6px">${X('Rewards are optional','Las recompensas son opcionales')}</h2><p class="sub" style="margin:0 0 14px">${X('Recognition works without money. Add a small monthly budget only if you want to.','El reconocimiento funciona sin dinero. Agrega un presupuesto mensual pequeño solo si quieres.')}</p>
    <div class="seg2" style="margin-bottom:14px"><button class="${!o.budgetOn?'on':''}" data-a="obSet" data-x="budgetOn|0">${X('No money for now','Sin dinero por ahora')}</button><button class="${o.budgetOn?'on':''}" data-a="obSet" data-x="budgetOn|1">${X('Set a monthly budget','Poner presupuesto mensual')}</button></div>
    ${o.budgetOn?`<div class="grid g2"><div class="field"><label class="label" for="obB">${X('Monthly reward budget per location','Presupuesto mensual por tienda')}</label><input id="obB" class="in" type="number" min="0" step="10" data-bind="ob.budget" data-num="1" value="${o.budget}"><div class="def">${X('Resets on the 1st. Unused budget doesn’t roll over.','Se reinicia el día 1. Lo que no se usa no se acumula.')}</div></div>
      <div class="field"><label class="label" for="obL">${X('Spending limit for managers','Límite para gerentes')}</label><select id="obL" class="in" data-bind="ob.limit" data-num="1">${[0,20,50,100].map(n=>`<option value="${n}" ${o.limit===n?'selected':''}>${n?$(n)+X(' per month',' al mes'):X('Owner approves everything','La dueña aprueba todo')}</option>`).join('')}</select><div class="def">${X('Above this, rewards wait for your approval.','Arriba de esto, las recompensas esperan tu aprobación.')}</div></div></div>
      <div class="alert b">${icon('wallet')}<div class="grow">${X('A budget is a spending limit. You add funds separately before gift cards can be sent.','El presupuesto es un límite de gasto. Los fondos se agregan aparte antes de enviar tarjetas.')} ${sim()}</div></div>`:''}`;
  } else {
    const n=o.emps.length;
    b=`<h2 style="margin:0 0 6px">${X('Send your first message','Envía tu primer mensaje')}</h2><p class="sub" style="margin:0 0 14px">${X('Get value today — no POS or timeclock needed.','Empieza hoy, sin POS ni reloj checador.')}</p>
    <label class="bigopt ${o.invite?'on':''}" style="font-size:15.5px;cursor:pointer"><input type="checkbox" data-c="obInvite" ${o.invite?'checked':''} ${n?'':'disabled'} style="width:22px;height:22px;accent-color:var(--purple)"><span>${X(`Text invitations to ${n} ${n===1?'person':'people'}`,`Mandar invitación por mensaje a ${n} ${n===1?'persona':'personas'}`)}<small>${X('Each person gets a personal link and verifies with a code.','Cada persona recibe un enlace personal y verifica con un código.')} ${sim()}</small></span></label>
    <label class="bigopt ${o.welcome?'on':''}" style="font-size:15.5px;cursor:pointer"><input type="checkbox" data-c="obWelcome" ${o.welcome?'checked':''} style="width:22px;height:22px;accent-color:var(--purple)"><span>${X('Post a welcome update','Publicar un aviso de bienvenida')}<small>${X('“Welcome to Plum Crew! We’ll use it for updates, thanks, and your ideas.” Translated for Spanish speakers.','“¡Bienvenidos a Plum Crew! Lo usaremos para avisos, agradecimientos y sus ideas.” Traducido para quien habla inglés o español.')}</small></span></label>
    ${!n?`<div class="alert a">${icon('alert')}<div class="grow">${X('You haven’t added anyone yet. You can finish now and add people in Team.','Aún no agregas a nadie. Puedes terminar y agregarlos en Equipo.')}</div></div>`:''}`;
  }
  return `<div class="wiz"><div class="steps" style="margin-bottom:16px">${steps.map((s,i)=>`<span class="step ${o.step===i+1?'on':o.step>i+1?'ok':''}"><b>${o.step>i+1?icon('check',12):i+1}</b>${s}</span>`).join('')}</div>

}

/* ============ Today ============ */
function todayPage(){
  const locs=scope(); const me=P(actorId()); const items=attention(locs); const all=S.view.allAttn;
  const fbNew=S.feedback.filter(f=>locs.includes(f.loc)&&fbVisible(f)&&fbOpen(f)).length;
  const part=participation(locs,30); const cov=coverage(locs,30);
  const budgetSet=locs.some(l=>L(l).budget>0);
  const avail=locs.reduce((a,l)=>a+Math.max(0,availLoc(l)),0), bud=locs.reduce((a,l)=>a+L(l).budget,0);
  const invPending=part.team.filter(p=>p.status==='invited').length, invFailed=part.team.filter(p=>p.status==='failed').length;
  const hello=X('Good morning, ','Buenos días, ')+first(me.name);
  let h=`<div class="page"><div class="page-h"><div><h1>${hello}</h1><div class="sub">${fd(S.day,null,{weekday:'long',month:'long',day:'numeric'})} · ${isOwner()&&multi()&&S.view.scope==='all'?X('All locations','Todas las tiendas'):esc(locs.map(l=>L(l).name).join(', '))}</div></div>
   ${isOwner()&&multi()&&S.view.scope!=='all'?`<button class="btn sm" data-a="setScope" data-x="all">${icon('left',13)} ${X('All locations','Todas las tiendas')}</button>`:''}</div>
   <div class="acts">
    <button class="act p" data-a="recognize">${'<span class="ai">'+icon('star',22)+'</span>'}<div><b>${X('Recognize someone','Reconocer a alguien')}</b><span>${X('Takes 20 seconds. Money optional.','Toma 20 segundos. Dinero opcional.')}</span></div></button>
    <button class="act" data-a="compose">${'<span class="ai">'+icon('mega',22)+'</span>'}<div><b>${X('Send update','Enviar aviso')}</b><span>${X('Write once — we translate.','Escribe una vez; nosotros traducimos.')}</span></div></button>
    <button class="act" data-a="nav" data-x="feedback">${'<span class="ai">'+icon('chat',22)+'</span>'}<div><b>${X('Review feedback','Revisar comentarios')}</b><span>${fbNew?X(`${fbNew} open`,`${fbNew} abiertos`):X('Nothing waiting','Nada pendiente')}</span></div></button>
   </div>`;
  if(isOwner()){ const tm=crew(LOCS().map(l=>l.id)).filter(p=>p.status!=='deactivated');
    const steps=[[tm.length>0,X('Add your team','Agrega a tu equipo'),'nav','team'],[tm.some(p=>p.status==='joined'),X('First employee joins','Se registra el primer empleado'),'nav','team'],[S.recogs.length>0,X('Send your first recognition','Envía tu primer reconocimiento'),'recognize',''],[S.updates.length>0,X('Send your first update','Envía tu primer aviso'),'compose',''],[LOCS().some(l=>l.funded>0),X('Add reward funds (optional)','Agrega fondos para recompensas (opcional)'),'openFunds',LOCS()[0].id]];
    const done=steps.filter(x=>x[0]).length;
    if(done<steps.length&&(S.recogs.length+S.updates.length)<3) h+=`<div class="card" style="margin-bottom:18px"><div class="sec-h" style="margin:0 0 8px"><h2>${X('Getting started','Primeros pasos')}</h2><span class="def">${done}/${steps.length} ${X('done','listos')}</span></div><div class="rows">${steps.map(([ok,lb,a,x])=>`<button class="rowi" ${ok?'disabled':''} data-a="${a}" data-x="${x}" style="${ok?'opacity:.6':''}"><span style="color:${ok?'var(--green)':'var(--muted)'}">${icon(ok?'check':'right',16)}</span><div class="grow"><div class="nm" style="${ok?'text-decoration:line-through':''}">${lb}</div></div></button>`).join('')}</div></div>`; }
  h+=`<div class="sec-h"><h2>${X('Needs your attention','Requiere tu atención')}</h2>${items.length>3?`<button class="btn link" data-a="toggleAllAttn">${all?X('Show top 3','Ver solo 3'):X(`View all (${items.length})`,`Ver todo (${items.length})`)}</button>`:''}</div>`;
  h+= items.length? (all?items:items.slice(0,3)).map(i=>`<div class="attn ${i.tone}"><span class="ai">${icon(i.ic,18)}</span><div class="grow"><div class="at">${esc(i.t)}</div><div class="aw">${esc(i.w)}</div></div><button class="btn ${i.pri<=1?'p':''}" data-a="${i.a}" data-x="${i.x}">${i.lbl}</button></div>`).join('')
     : `<div class="okbar" style="margin-bottom:10px">${icon('check')} ${X('You’re all caught up. Nice work.','Estás al día. ¡Buen trabajo!')}</div>`;
  if(isOwner()&&multi()&&S.view.scope==='all'){
    const ls=LOCS().map(l=>({l,a:attention([l.id]),cov:coverage([l.id],30),part:participation([l.id],30)})).sort((x,y)=>(y.a.filter(i=>i.pri<=2).length-x.a.filter(i=>i.pri<=2).length)||(y.a.length-x.a.length));
    h+=`<div class="sec-h" style="margin-top:22px"><h2>${X('Locations','Tiendas')}</h2><span class="def">${X('Sorted by what needs attention','Ordenadas por lo que requiere atención')}</span></div><div class="rows">${ls.map(x=>{ const urgent=x.a.filter(i=>i.pri<=2).length; return `<button class="rowi" data-a="setScope" data-x="${x.l.id}"><div class="av" style="border-radius:10px">${icon('pin',16)}</div><div class="grow"><div class="nm">${esc(x.l.name)} ${urgent?stp('need',urgent+X(' urgent',' urgentes')):x.a.length?stp('prog',x.a.length+X(' to review',' por revisar')):stp('done',X('All good','Todo bien'))}</div><div class="mt">${esc((S.people.find(p=>p.perm==='manager'&&p.mgrLocs.includes(x.l.id))||{name:'—'}).name)} · ${x.part.joined.length}/${x.part.team.length} ${X('joined','registrados')} · ${x.cov.got.size}/${x.cov.team.length} ${X('recognized','reconocidos')}${x.a[0]?' · '+esc(x.a[0].t):''}</div></div>${icon('right',15)}</button>`; }).join('')}</div>`;
  }
  h+=`<div class="sec-h" style="margin-top:22px"><h2>${X('At a glance','De un vistazo')}</h2><button class="btn link" data-a="nav" data-x="reports">${X('Reports','Reportes')} ${icon('right',13)}</button></div><div class="sum">
    <button class="sumc" data-a="nav" data-x="team"><div class="l">${X('Team reach','Alcance del equipo')} ${icon('users',15)}</div><div class="v">${part.joined.length}<span class="muted" style="font-size:16px">/${part.team.length}</span></div><div class="s">${X('joined','registrados')}${invPending?` · ${invPending} ${X('invited','invitados')}`:''}${invFailed?` · <b style="color:var(--red)">${invFailed} ${X('not delivered','no entregadas')}</b>`:''}</div></button>
    <button class="sumc" data-a="goTeamCoverage"><div class="l">${X('Recognition coverage','Cobertura de reconocimiento')} ${icon('star',15)}</div><div class="v">${cov.got.size}<span class="muted" style="font-size:16px">/${cov.team.length}</span></div><div class="s">${X('recognized in the last 30 days','reconocidos en los últimos 30 días')}</div></button>
    <button class="sumc" data-a="nav" data-x="rewards"><div class="l">${X('Reward budget','Presupuesto de recompensas')} ${icon('wallet',15)}</div>${budgetSet?`<div class="v">${$(avail)}</div><div class="s">${X(`available of ${$(bud)} for ${monthName(S.day)}`,`disponible de ${$(bud)} en ${monthName(S.day)}`)}</div>`:`<div class="v" style="font-size:18px">${X('Not set','Sin definir')}</div><div class="s">${X('Optional — recognition works without money','Opcional: el reconocimiento funciona sin dinero')}</div>`}</button>
  </div></div>`;
  return h;
}

/* ============ Team ============ */
function personStatus(p){
  if(p.status==='joined') return stp('done',X('Joined','Registrado'));
  if(p.status==='invited') return stp('info',X('Invited','Invitado')+(p.inviteSent!=null?' · '+rel(p.inviteSent):''));
  if(p.status==='failed') return stp('need',X('Invite not delivered','Invitación no entregada'));
  if(p.status==='deactivated') return stp('mute',X('Deactivated','Desactivado'));
  return stp('mute',X('Not invited','Sin invitar'));
}

   ${covOpen?`<div class="grid g2" style="margin-top:12px"><div><div class="label">${X('By role','Por puesto')}</div>${Object.entries(cov.byRole).map(([r,v])=>`<div class="bar-row"><span>${roleL(r)}</span><div class="meter"><i style="width:${v.r/v.n*100}%;background:var(--green)"></i></div><span class="mono">${v.r}/${v.n}</span></div>`).join('')}</div><div><div class="label">${X('By shift','Por turno')}</div><div class="def">${S.org.integrations.timeclock.connected?X('AM shift: 60% · PM shift: 45% (from schedule data)','Turno AM: 60% · Turno PM: 45% (según el horario)'):X('Connect a schedule to see coverage by shift. Optional.','Conecta un horario para ver la cobertura por turno. Opcional.')}</div><div class="label" style="margin-top:12px">${X('Not yet recognized','Aún sin reconocimiento')}</div><div class="chips">${cov.missing.map(p=>`<button class="chip" data-a="recognize" data-x="${p.id}">${icon('star',13)} ${esc(p.name)}</button>`).join('')||`<span class="def">${X('Everyone has been recognized.','Todos han recibido reconocimiento.')}</span>`}</div></div></div>`:''}</div>`;

  return h;

  <div class="funnel" style="margin-bottom:6px">${[['sent',X('Sent','Enviado')],['delivered',X('Delivered','Entregado')],['opened',X('Opened','Abierto')]].concat(u.mode==='important'?[['ack',X('Acknowledged','Confirmado')]]:[]).concat(u.mode==='question'?[['replied',X('Replied','Respondido')]]:[]).concat([['failed',X('Failed','Falló')]]).map(([k,l])=>`<div><small>${l}</small><b style="${k==='failed'&&c.failed?'color:var(--red)':''}">${c[k]}</b></div>`).join('')}</div>

  <div class="rows">${people.map(x=>`<div class="rowi"><div class="av">${initials(x.p.name)}</div><div class="grow"><div class="nm">${esc(x.p.name)}</div><div class="mt">${roleL(x.p.role)} · ${x.p.lang==='es'?'Español':'English'} · ${x.r.ch==='app'?X('in Plum Crew','en Plum Crew'):X('text message link','mensaje con enlace')}${x.r.st==='failed'?' · '+X('check phone number','revisa el número'):''}</div></div>${st(x.r)}</div>`).join('')}</div>`}
  </div>`;
}

/* ============ Feedback (management) ============ */
function fbTypePill(f){ return f.type==='suggestion'?stp('info',X('Suggestion','Sugerencia')):f.type==='positive'?stp('done',X('Going well','Va bien')):stp('pur',X('Private concern','Inquietud privada')); }
function fbStatusPill(f){ if(fbOverdue(f)) return stp('need',X('Reply late','Respuesta atrasada')); return ({received:stp('need',X('Needs reply','Falta responder')),working:stp('prog',X('Working on it','En proceso')),reopened:stp('need',X('Reopened','Reabierto')),resolved:stp('done',X('Resolved — waiting for employee','Resuelto: falta que confirme')),confirmed:stp('done',X('Closed — employee confirmed','Cerrado: confirmado'))})[f.status]; }
function feedbackPage(){
  if(S.view.sub){ const f=S.feedback.find(x=>x.id===S.view.sub); if(f&&fbVisible(f)) return feedbackDetail(f); }
  const tab=S.view.fbTab||'inbox'; const locs=scope();
  const vis=S.feedback.filter(f=>locs.includes(f.loc)&&fbVisible(f));
  const open=vis.filter(fbOpen), closed=vis.filter(f=>!fbOpen(f));
  const pulses=S.pulses.filter(p=>p.locs.some(l=>locs.includes(l))); const wins=S.wins.filter(w=>locs.includes(w.loc));
  let body='';
  if(tab==='inbox'||tab==='closed'){ const list=(tab==='inbox'?open:closed).sort((a,b)=>(fbOverdue(b)-fbOverdue(a))||(b.created-a.created));
    body= list.length?`<div class="rows">${list.map(f=>`<button class="rowi" data-a="openFeedback" data-x="${f.id}"><div class="grow"><div class="nm">${fbTypePill(f)} ${topicL(f.topic)} · ${esc(P(f.pid).name)}${f.about!=='none'?' '+stp('pur',f.about==='manager'?X('About a manager','Sobre un gerente'):X('About the owner','Sobre la dueña')):''}</div><div class="mt">${multi()?esc(L(f.loc).name)+' · ':''}${X('Handled by ','Lo atiende ')}${esc(P(f.handler).name)}${fbOpen(f)?' · '+X('next update ','próxima respuesta ')+fd(f.nextBy):''}</div></div>${fbStatusPill(f)}</button>`).join('')}</div>`:`<div class="empty">${tab==='inbox'?X('No open feedback. When your team shares something, it shows up here.','No hay comentarios abiertos. Cuando tu equipo comparta algo, aparecerá aquí.'):X('Nothing closed yet.','Aún no hay cerrados.')}</div>`; }
  if(tab==='pulse'){ body=`<div class="row between" style="margin-bottom:10px"><span class="def">${X('One question, optional comment. Anonymous check-ins hide results until 5 people answer, and never break results down by role.','Una pregunta y comentario opcional. Las anónimas ocultan resultados hasta tener 5 respuestas y nunca se desglosan por puesto.')}</span><button class="btn p" data-a="newPulse">${icon('plus',15)} ${X('New check-in','Nueva pregunta')}</button></div>`+(S.view.pulseNew?pulseForm():'')+(pulses.length?pulses.map(pulseCard).join(''):`<div class="empty">${X('No check-ins yet.','Aún no hay preguntas.')}</div>`); }
  if(tab==='wins'){ body=`<div class="row between" style="margin-bottom:10px"><span class="def">${X('Show the team what changed because they spoke up.','Muestra al equipo qué cambió porque hablaron.')}</span><button class="btn p" data-a="newWin" data-x="">${icon('plus',15)} ${X('New post','Nueva publicación')}</button></div>`+(S.view.winNew?winForm():'')+(wins.length?`<div class="grid g2">${wins.map(w=>`<div class="card"><div class="label">${X('You said','Ustedes dijeron')}</div><p style="margin:0 0 10px">${esc(w.said[S.lang]||w.said.en)}</p><div class="label">${X('We did','Nosotros hicimos')}</div><p style="margin:0">${esc(w.did[S.lang]||w.did.en)}</p><div class="def" style="margin-top:8px">${esc(L(w.loc).name)} · ${fd(w.day)}</div></div>`).join('')}</div>`:`<div class="empty">${X('Nothing posted yet.','Aún no hay publicaciones.')}</div>`); }
  return `<div class="page">${backToMore()}<div class="page-h"><div><h1>${X('Feedback','Comentarios')}</h1><div class="sub">${X('Kept separate from rewards and performance.','Separado de recompensas y desempeño.')}</div></div></div>
  <div class="chips" style="margin-bottom:14px">${[['inbox',X('Open','Abiertos'),open.length],['closed',X('Closed','Cerrados'),closed.length],['pulse',X('Check-ins','Preguntas rápidas'),pulses.length],['wins',X('You said, we did','Dijeron / hicimos'),wins.length]].map(([k,l,n])=>`<button class="chip ${tab===k?'on':''}" data-a="fbTab" data-x="${k}">${l} <span class="mono">${n}</span></button>`).join('')}</div>${body}</div>`;
}
function pulseCard(p){ const n=p.responses.length; const hide=p.anon&&n<5; const cnt=k=>p.responses.filter(r=>r.v===k).length; const lab={yes:X('Yes','Sí'),some:X('Somewhat','Más o menos'),no:X('No','No')};
  return `<div class="card" style="margin-bottom:12px"><div class="row between"><h3 style="margin:0">${esc(p.q[S.lang])}</h3><span class="row">${p.anon?stp('pur',X('Anonymous','Anónima')):stp('mute',X('Named','Con nombre'))}${p.status==='open'?stp('info',X('Open','Abierta')):stp('mute',X('Closed','Cerrada'))}</span></div>
  <div class="def" style="margin:4px 0 10px">${multi()?esc(p.locs.map(l=>L(l).name).join(', '))+' · ':''}${n} ${X('responses','respuestas')} · ${fd(p.day)}</div>
  ${hide?`<div class="alert b">${icon('lock')}<div class="grow">${X(`Results appear once 5 people answer (${n} so far). This protects people in small teams.`,`Los resultados aparecen cuando respondan 5 personas (${n} hasta ahora). Esto protege a equipos pequeños.`)}</div></div>`:
   `${p.opts.map(k=>`<div class="bar-row"><span>${lab[k]}</span><div class="meter"><i style="width:${n?cnt(k)/n*100:0}%;background:var(--purple)"></i></div><span class="mono">${cnt(k)}</span></div>`).join('')}${p.responses.filter(r=>r.comment).map(r=>`<div class="msg" style="max-width:100%">${r.pid&&!p.anon?`<div class="who"><b>${esc(P(r.pid).name)}</b></div>`:''}${esc(r.comment)}</div>`).join('')}`}
  ${p.status==='open'?`<div class="row" style="margin-top:10px"><button class="btn sm" data-a="closePulse" data-x="${p.id}">${X('Close check-in','Cerrar pregunta')}</button></div>`:''}</div>`; }
function pulseForm(){ const f=S.view.pulseNew; const qs=[['breaks',{en:'Did you get your breaks this week?',es:'¿Tuviste tus descansos esta semana?'}],['tools',{en:'Do you have what you need to do your job well?',es:'¿Tienes lo que necesitas para hacer bien tu trabajo?'}]];
  return `<div class="card" style="margin-bottom:12px;border-color:var(--purple)"><h3>${X('New check-in','Nueva pregunta rápida')}</h3><div class="field"><span class="label">${X('Question','Pregunta')}</span><div class="chips">${qs.map(([k,q])=>`<button class="chip ${f.q===k?'on':''}" data-a="pfSet" data-x="q|${k}">${esc(q[S.lang])}</button>`).join('')}</div><div class="def" style="margin-top:6px">${X('Answers: Yes · Somewhat · No, plus an optional comment.','Respuestas: Sí · Más o menos · No, más un comentario opcional.')}</div></div>
   <label class="chk" style="font-size:14px"><input type="checkbox" data-c="pfAnon" ${f.anon?'checked':''}> ${X('Anonymous (names not stored; results hidden until 5 answers; no breakdowns)','Anónima (no se guardan nombres; resultados ocultos hasta 5 respuestas; sin desgloses)')}</label>
   ${f.anon&&crew(scope()).filter(p=>p.status==='joined').length<8?`<div class="alert a" style="margin-top:8px">${icon('alert')}<div class="grow">${X('Your team is small, so anonymous comments may still be recognizable. Tell people that before they answer.','Tu equipo es pequeño, así que los comentarios anónimos podrían reconocerse. Avísales antes de que respondan.')}</div></div>`:''}
   <div class="wiz-foot"><button class="btn" data-a="pfCancel">${X('Cancel','Cancelar')}</button><button class="btn p" data-a="pfSend">${X('Send check-in','Enviar pregunta')}</button></div></div>`; }

   ${fbOpen(f)?`<div class="card" style="margin-top:10px"><span class="label">${X('Reply to ','Responder a ')}${esc(first(e.name))} <span class="muted">(${X('reads ','lee en ')}${langName(outLang)})</span></span>

}

/* ============ Rewards & budget ============ */
function rewardsPage(){
  const locs=scope(); const own=isOwner(); const me=P(actorId());
  const aps=S.approvals.filter(a=>locs.includes(a.loc)&&(own||S.recogs.find(r=>r.id===a.rid).from===me.id));
  const red=S.ledger.filter(l=>l.kind==='redeem'&&locs.includes(l.loc)).sort((a,b)=>b.day-a.day);
  const recent=S.recogs.filter(r=>locs.includes(r.loc)).sort((a,b)=>b.day-a.day).slice(0,8);
  const fsLabel={ok:stp('done',X('Funded','Con fondos')),low:stp('prog',X('Low balance','Saldo bajo')),empty:stp('need',X('No funds','Sin fondos'))};

     <div class="rows">${team.map(p=>{ const n=auto?shifts(p.id):null; const ok=!auto||n>=w.target; return `<label class="rowi" style="cursor:${ok?'pointer':'default'}"><input type="checkbox" data-a="gwEmp" data-x="${p.id}" ${w.eligible.includes(p.id)?'checked':''} ${ok?'':'disabled'} style="width:20px;height:20px;accent-color:var(--purple)"><div class="grow"><div class="nm">${esc(p.name)}</div><div class="mt">${roleL(p.role)}${auto?' · '+X(`${n} shifts scheduled in this period`,`${n} turnos programados en el periodo`):''}</div></div>${ok?'':stp('mute',X(`Can’t reach ${w.target}`,`No alcanza ${w.target}`))}</label>`; }).join('')}</div>

function goalDetail(g){
  const auto=g.method==='auto'; const tcI=S.org.integrations.timeclock;
  const disputes=auto?Object.entries(g.shifts).flatMap(([pid,l])=>l.filter(s=>s.st==='disputed').map(s=>({pid,s}))):[];
  const pend=auto?Object.values(g.shifts).flat().filter(s=>s.st==='pending_data').length:0;
  return `<div class="page"><button class="back" data-a="closeSub">${icon('left',14)} ${X('Team goals','Metas del equipo')}</button>
  <div class="page-h"><div><h1 style="font-size:22px">${goalTitle(g)} · ${esc(L(g.loc).name)}</h1><div class="sub">${fd(g.start)} – ${fd(g.end)} · ${$(g.reward)} ${X('each','c/u')} · ${auto?X('measured automatically','medición automática'):X('manager confirms','confirma el gerente')}</div></div>${g.status==='active'?`<button class="btn d" data-a="endGoal" data-x="${g.id}">${X('End goal','Terminar meta')}</button>`:stp('mute',X('Ended','Terminada'))}</div>
  ${pend?`<div class="alert a" style="margin-bottom:10px">${icon('clock')}<div class="grow"><b>${X('Timeclock data is late.','Los datos del reloj llegan tarde.')}</b> ${X(`${pend} shift(s) are waiting. Progress is paused — nothing counts against anyone.`,`${pend} turno(s) en espera. El progreso está en pausa; nada cuenta en contra.`)}</div></div>`:''}
  ${disputes.map(({pid,s})=>`<div class="alert r" style="margin-bottom:10px">${icon('alert')}<div class="grow"><b>${X(`${P(pid).name} disputes a late shift`,`${P(pid).name} disputa un turno tarde`)}</b> · ${fd(s.day)} · “${esc(s.disp)}”</div><button class="btn sm" data-a="goalDispute" data-x="${g.id}|${pid}|${s.day}|keep">${X('Keep as late','Dejar como tarde')}</button><button class="btn sm p" data-a="goalDispute" data-x="${g.id}|${pid}|${s.day}|ok">${X('Count it on time','Contar a tiempo')}</button></div>`).join('')}
  <div class="funnel" style="grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:14px"><div><small>${X('Goal reached','Meta lograda')}</small><b>${Object.keys(g.done).length}/${g.eligible.length}</b></div><div><small>${X('Reward earned','Recompensa ganada')}</small><b>${$(Object.keys(g.done).length*g.reward)}</b></div><div><small>${X('Reward issued','Recompensa entregada')}</small><b>${$(S.ledger.filter(l=>l.kind==='redeem'&&l.status==='issued'&&g.eligible.includes(l.pid)&&l.day>=g.start).reduce((a,l)=>a+Math.min(l.amt,g.reward),0))}</b></div><div><small>${X('Still reserved','Aún reservado')}</small><b>${$((g.eligible.length-Object.keys(g.done).length)*g.reward)}</b></div></div>
  <div class="rows">${g.eligible.map(pid=>{ const p=P(pid); const pr=goalProgress(g,pid); const done=g.done[pid]!=null;
    return `<div class="rowi"><div class="av">${initials(p.name)}</div><div class="grow"><div class="nm">${esc(p.name)}</div><div class="mt">${auto?X(`${pr.n} of ${g.target} on-time shifts · ${pr.left} scheduled left`,`${pr.n} de ${g.target} turnos a tiempo · quedan ${pr.left} programados`):(done?X('Confirmed by manager','Confirmado por el gerente'):X('Waiting for manager confirmation','Esperando confirmación del gerente'))}</div>${auto?`<div class="meter" style="margin-top:6px;max-width:240px"><i style="width:${Math.min(100,pr.n/g.target*100)}%;background:var(--purple)"></i></div>`:''}</div>${done?stp('done',X('Goal reached','Meta lograda')):(!auto&&g.status==='active'?`<button class="btn sm p" data-a="goalConfirm" data-x="${g.id}|${pid}">${X('Mark complete','Marcar como logrado')}</button>`:stp('prog',X('In progress','En curso')))}</div>`; }).join('')}</div>

/* ============ Reports ============ */
function reportsPage(){
  const locs=scope(); const r=S.view.range||30; const pt=participation(locs,r); const cov=coverage(locs,r);
  const fb=S.feedback.filter(f=>locs.includes(f.loc)&&S.day-f.created<r);
  const fast=fb.filter(f=>f.firstResp!=null&&f.firstResp-f.created<=1).length;
  const resolved=fb.filter(f=>['resolved','confirmed'].includes(f.status)).length, confirmed=fb.filter(f=>f.status==='confirmed').length;
  const L2=S.ledger.filter(l=>locs.includes(l.loc)&&S.day-l.day<r);
  const earned=L2.filter(l=>l.kind==='credit').reduce((a,l)=>a+l.amt,0), issued=L2.filter(l=>l.kind==='redeem'&&l.status==='issued').reduce((a,l)=>a+l.amt,0), failed=L2.filter(l=>l.kind==='redeem'&&l.status==='failed').length;
  const goals=S.goals.filter(g=>locs.includes(g.loc));

function retentionCard(locs,r){
  if(S.history==='none') return `<div class="card" style="margin-top:14px"><h3>${X('Retention','Retención')}</h3><div class="empty">${icon('clock',20)}<p style="margin:8px 0 0">${X('Not enough history yet. Retention needs at least 3 months of roster data, including people who leave. We’ll start showing it once that history exists.','Aún no hay suficiente historial. La retención necesita al menos 3 meses de datos, incluidas las bajas. La mostraremos cuando exista ese historial.')}</p></div></div>`;
  const months=r<=30?1:r<=90?3:6; const H=locs.reduce((a,l)=>a+crew([l]).length,0);
  const base=[{m:'Apr',ly:7,ty:7},{m:'May',ly:8,ty:7},{m:'Jun',ly:9,ty:7},{m:'Jul',ly:9,ty:6},{m:'Aug',ly:8,ty:6},{m:'Sep',ly:8,ty:5}].map(x=>({m:x.m,ly:Math.max(0,Math.round(x.ly*H/48)),ty:Math.max(0,Math.round(x.ty*H/48))})).slice(-months);
  const ly=base.reduce((a,x)=>a+x.ly,0), ty=base.reduce((a,x)=>a+x.ty,0); const fewer=Math.max(0,ly-ty);
  const cost=S.view.repCost??1450; const cohort=Math.max(3,Math.round(H*.25)), stay=Math.round(cohort*.64);
  const ES={Apr:'abr',May:'may',Jun:'jun',Jul:'jul',Aug:'ago',Sep:'sept'};
  return `<div class="card" style="margin-top:14px"><div class="row between"><h3 style="margin:0">${X('Retention','Retención')}</h3>${sim(X('SAMPLE HISTORY','HISTORIAL DE EJEMPLO'))}</div>
   <p class="def">${X(`Turnover = hourly employees who left ÷ average hourly headcount (about ${H} people). Compared with the same months last year to reduce seasonal effects.`,`Rotación = empleados por hora que se fueron ÷ plantilla promedio (unas ${H} personas). Comparado con los mismos meses del año pasado para reducir efectos de temporada.`)}</p>
   ${months<3?`<div class="alert b">${icon('clock')}<div class="grow">${X('One month is too short to read a trend. Switch to 3 or 6 months.','Un mes es muy poco para ver una tendencia. Cambia a 3 o 6 meses.')}</div></div>`:''}
   <div class="tbl-wrap"><table class="tbl"><thead><tr><th>${X('Month','Mes')}</th><th class="num">${X('Left last year','Bajas año pasado')}</th><th class="num">${X('Left this year','Bajas este año')}</th><th class="num">${X('This year %','% este año')}</th></tr></thead><tbody>${base.map(x=>`<tr><td>${S.lang==='es'?ES[x.m]:x.m}</td><td class="num">${x.ly}</td><td class="num">${x.ty}</td><td class="num">${(x.ty/H*100).toFixed(1)}%</td></tr>`).join('')}<tr><td><b>${X('Total','Total')}</b></td><td class="num"><b>${ly}</b></td><td class="num"><b>${ty}</b></td><td class="num">${(ty/H/months*100).toFixed(1)}% ${X('avg/mo','prom./mes')}</td></tr></tbody></table></div>
   <div class="grid g2" style="margin-top:14px"><div><div class="label">${X('New hires still here at 90 days','Nuevos que siguen a los 90 días')}</div><div class="big">${stay} ${X('of','de')} ${cohort}</div><div class="def">${X(`Eligible cohort: people hired 90–180 days ago (${cohort}). Small groups swing a lot — read with care.`,`Grupo elegible: contratados hace 90–180 días (${cohort}). En grupos pequeños varía mucho; léelo con cuidado.`)}</div></div>
    <div class="card roi" style="padding:14px"><div class="row between"><b>${X('Estimated value of fewer departures','Valor estimado de menos bajas')}</b><span class="est">${X('ESTIMATE','ESTIMACIÓN')}</span></div>
     <div class="row" style="margin:8px 0;gap:8px;align-items:center"><span class="def">${X('Departures vs last year','Bajas vs año pasado')}: <b>${fewer}</b> ${X('fewer','menos')} ×</span><label class="small row" style="gap:6px">${X('cost per departure','costo por baja')} $<input class="in" type="number" min="0" step="50" style="width:90px;min-height:34px;padding:4px 8px" data-bind="view.repCost" data-num="1" data-rerender="1" value="${cost}"></label></div>
     <div class="roi-v" style="font-size:24px">${$(fewer*cost)}</div>
     <p class="def" style="margin:6px 0 0">${X('This is avoided hiring and training cost under your assumption — not the return on Plum Crew. Pay, scheduling, management, seasonality, and other changes may also contribute. Activity in the app moving with lower turnover doesn’t prove one caused the other.','Es el costo de contratación y capacitación evitado según tu supuesto, no el retorno de Plum Crew. El pago, los horarios, la gerencia, la temporada y otros cambios también pueden influir. Que el uso de la app coincida con menos rotación no prueba que una cause la otra.')}</p></div></div></div>`;
}

function eNav(){ const cur=S.view.e||'home'; const me=ME(); const b=myUpdates().filter(u=>uActive(u)&&((u.mode==='important'&&!u.rec[me.id].ack)||(u.mode==='question'&&!u.rec[me.id].reply))).length;
  return `<nav class="enav" aria-label="App">${[['home','home','nav_home'],['updates','mega','nav_updates'],['feedback','chat','nav_feedback'],['rewards','gift','nav_rewards']].map(([k,ic,l])=>`<button class="${cur===k?'on':''}" data-a="eGo" data-x="${k}">${icon(ic,22)}<span>${t(l)}</span>${k==='updates'&&b?`<span class="badge">${b}</span>`:''}</button>`).join('')}</nav>`; }
function employeeView(){
  const me=ME(); if(!me) return `<div class="eonb-wrap"><div class="eonb"><h2>${X('No employees yet','Aún no hay empleados')}</h2><p class="lead">${X('Finish setup as the owner and add people first.','Termina la configuración como dueña y agrega personas primero.')}</p></div></div>`;
  if(!S.sess[me.id]||me.status==='deactivated') return accessView();
  const scr=S.view.e||'home';
  const body=({home:eHome,updates:eUpdates,feedback:eFeedback,rewards:eRewards})[scr]();
  return `<div class="eapp" lang="${S.lang}">${eNav()}<div class="emain"><div class="einner scr-${scr}">${body}</div></div></div>${eSheet()}`;
}
function eHome(){
  const me=ME(); const ups=myUpdates().filter(uActive); const r=me.id;

  const fb=myFeedback().find(f=>f.status==='resolved')||myFeedback().find(fbOpen);
  const rc=myRecogs()[0]; const bal=balance(r); const g=myGoals()[0]; const pulse=openPulse();
  const win=S.wins.filter(w=>me.locs.includes(w.loc)&&S.day-w.day<14).sort((a,b)=>b.day-a.day)[0];

  if(win) h+=`<div class="ecard" style="margin-bottom:18px;background:#f4fbf6;border-color:#bfe3cc"><div class="k"><span>${t('ysw_title')}</span>${stp('done',t('ysw_new'))}</div><p style="margin:0"><b>${esc(win.said[S.lang]||win.said.en)}</b> → ${esc(win.did[S.lang]||win.did.en)}</p></div>`;
  h+=`<div class="egrid">`;
  if(need){ const tx=uText(need,S.lang); h+=`<div class="ecard"><div class="k"><span>${t('k_today')}</span>${need.mode==='important'&&!need.rec[r].ack?stp('need',t('needs_ok')):need.mode==='question'?stp('info',t('q')):''}</div><div class="h">${esc(tx.t)}</div><p class="small muted" style="margin:0 0 12px">${t('from',{name:P(need.author).name})}</p><button class="ebtn p" data-a="eOpenUpd" data-x="${need.id}">${need.mode==='question'?t('answer_q'):t('open_update')}</button></div>`; }
  else h+=`<div class="ecard"><div class="k"><span>${t('k_today')}</span>${stp('done','✓')}</div><p>${t('today_none')}</p>${pulse?`<button class="ebtn p" data-a="eFbNew" data-x="pulse">${t('ft_pulse')}: ${esc(pulse.q[S.lang])}</button>`:''}</div>`;
  if(fb) h+=`<div class="ecard"><div class="k"><span>${t('k_feedback')}</span>${eFbPill(fb)}</div><div class="h">${t('ft_'+fb.type)} · ${t('tp_'+fb.topic)}</div><p class="small muted" style="margin:0 0 12px">${fb.status==='resolved'?t('resolved_q',{name:P(fb.handler).name}):t('handled_by',{name:P(fb.handler).name})+' · '+t('next_by',{date:fd(fb.nextBy)})}</p><button class="ebtn ${fb.status==='resolved'||fbOverdue(fb)?'p':''}" data-a="eOpenFb" data-x="${fb.id}">${t('view_status')}</button></div>`;
  else h+=`<div class="ecard"><div class="k"><span>${t('k_feedback')}</span></div><p>${t('fb_none')}</p><button class="ebtn" data-a="eGo" data-x="feedback">${t('share')}</button></div>`;
  if(rc){ const from=P(rc.from); h+=`<div class="ecard"><div class="k"><span>${t('k_recog')}</span><span class="small mono">${fd(rc.day)}</span></div><div class="h">${rc.kind==='peer'?t('shout_from',{from:first(from.name),to:t('you')}):t('recog_from',{name:from.name})}</div><p style="margin:0 0 6px">${reasonL(rc.reason)}</p>${rc.amt&&rc.reward==='approved'?`<p class="small" style="margin:0 0 12px;color:var(--green);font-weight:700">${t('reward_added',{amt:rc.amt})}</p>`:''}<button class="ebtn" data-a="sheet" data-x="recogs">${t('see_all')}</button></div>`; }
  else h+=`<div class="ecard"><div class="k"><span>${t('k_recog')}</span></div><p>${t('recog_none')}</p><button class="ebtn" data-a="sheet" data-x="thank">${t('thank')}</button></div>`;
  h+=`<div class="ecard"><div class="k"><span>${t('k_reward')}</span><span class="mono">$${bal}</span></div>${g?`<div class="h" style="font-size:18px">${t('goal_line',{title:goalTitle(g)})}</div><p class="small muted" style="margin:0 0 12px">${g.done[r]!=null?t('goal_reached')+' · '+t('reward_earned'):(g.method==='auto'?`${goalProgress(g,r).n}/${g.target}`:'')+' · $'+g.reward}</p>`:`<p>${t('bal_line',{amt:bal})}</p>`}<button class="ebtn" data-a="eGo" data-x="rewards">${t('see_rewards')}</button></div>`;
  h+=`</div><div class="ecard" style="margin-top:18px;flex-direction:row;align-items:center;gap:14px"><span class="ico" style="width:42px;height:42px;border-radius:12px;background:var(--greenL);color:var(--green)">${icon('heart',20)}</span><div style="flex:1"><b>${t('thank')}</b><div class="small muted">${t('thank_sub')}</div></div><button class="btn p" data-a="sheet" data-x="thank">${t('thank')}</button></div>`;
  return h;
}
function eFbPill(f){ if(f.status==='resolved') return stp('done',t('s_resolved')); if(f.status==='confirmed') return stp('mute',t('s_confirmed')); if(fbOverdue(f)) return stp('need',t('overdue')); if(f.status==='reopened') return stp('prog',t('s_reopened')); return f.status==='received'?stp('info',t('s_received')):stp('prog',t('s_working')); }

     <div class="h" style="font-size:24px" lang="${showO?u.orig.lang:S.lang}">${esc(showO?u.orig.t:tx.t)}</div><p lang="${showO?u.orig.lang:S.lang}">${esc(showO?u.orig.b:tx.b)}</p>

  const ups=myUpdates();

   ${wins.length?`<h3 style="margin:24px 0 10px">${t('ysw_title')}</h3><div class="egrid">${wins.map(w=>`<div class="ecard" style="background:#f4fbf6;border-color:#bfe3cc"><p style="margin:0"><b>${esc(w.said[S.lang]||w.said.en)}</b></p><p style="margin:6px 0 0">→ ${esc(w.did[S.lang]||w.did.en)}</p><div class="small muted" style="margin-top:6px">${fd(w.day)}</div></div>`).join('')}</div>`:''}

   <div class="feedtype">${[['suggestion','bulb'],['positive','smile'],['concern','lock']].map(([k,ic])=>`<button class="bigopt" data-a="eFbNew" data-x="${k}">${icon(ic,24)}<span>${t('ft_'+k)}<small>${t('ft_'+k+'_s')}</small></span></button>`).join('')}${pulse?`<button class="bigopt" data-a="eFbNew" data-x="pulse" style="border-color:var(--purple)">${icon('chat',24)}<span>${t('ft_pulse')}<small>${esc(pulse.q[S.lang])}</small></span></button>`:''}</div>

  sendRecog(){ const d=S.drawer,f=d.f; if(!f.to||!f.reason){ d.err=true; return; } const me=P(actorId()); const to=P(f.to); const loc=to.locs.find(l=>scope().includes(l))||to.locs[0];

document.addEventListener('click',ev=>{ const el=ev.target.closest('[data-a]'); if(!el||el.disabled) return; const fn=A[el.dataset.a]; if(!fn) return; if(el.tagName==='A') ev.preventDefault(); const r=fn(el.dataset,el.dataset.x,el,ev); if(r===false) return; render(); });

function bindVal(el){ const b=el.dataset.bind; let v=el.type==='checkbox'?el.checked:el.value; if(el.dataset.num) v=+v||0;
  if(b==='meEmail'){ UI.meForm.email=v; return; } if(b==='meCode'){ UI.meForm.code=v; return; } if(b==='thq'){ UI.th.q=v; return; } if(b==='thnote'){ UI.th.note=v; return; } if(b==='__fund'){ UI.fundAmt=v; return; } if(b==='__bud'){ UI.budAmt=v; return; }
  setPath(b,v); }
document.addEventListener('input',ev=>{ const el=ev.target; if(!el.dataset||!el.dataset.bind||el.tagName==='SELECT') return; bindVal(el);
  const live=el.dataset.live; if(live==='trEdit'&&S.comp) S.comp.edited=true; if(live==='recogNote'&&S.drawer){ S.drawer.f.tr=null; S.drawer.f.trErr=false; } if(live==='frText'&&S.view.fbReply){ S.view.fbReply.tr=null; }
  if(live&&live!=='trEdit'){ const sel=`[data-bind="${el.dataset.bind}"]`; const pos=el.selectionStart; render(); const n=document.querySelector(sel); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} } } else save(); });
document.addEventListener('change',ev=>{ const el=ev.target;
  if(el.dataset.bind&&(el.tagName==='SELECT'||el.dataset.rerender)){ bindVal(el); render(); return; }
  const c=el.dataset.c; if(!c) return; const v=el.type==='checkbox'?el.checked:el.value;
  if(c==='scope'){ S.view.scope=v; S.view.sub=null; }
  else if(c==='scenario'){ const lang=S.lang; S=seed(v); S.lang=lang; if(v==='new'){ S.demo.as='owner'; } }
  else if(c==='as'){ S.demo.as=v; S.view.page='today'; S.view.sub=null; S.drawer=null; S.comp=null; S.gw=null; UI.sheet=null; if(v==='employee'){ if(!S.demo.emp){ const e=S.people.find(p=>p.perm==='employee'); S.demo.emp=e&&e.id; } if(ME()) S.lang=ME().lang; S.view.e='home'; S.view.esub=null; } if(v==='manager'&&!S.demo.mgr) S.demo.mgr=managerIdDefault(); }
  else if(c==='mgr'){ S.demo.mgr=v; S.view.sub=null; }
  else if(c==='emp'){ S.demo.emp=v; S.lang=P(v).lang; S.ea=null; S.view.e='home'; S.view.esub=null; UI.sheet=null; }
  else if(['trFail','smsFail','giftFail','tcDelay'].includes(c)){ S.demo[c]=v; if(c==='tcDelay'&&!v){ S.goals.forEach(g=>{ if(g.method==='auto') Object.entries(g.shifts).forEach(([pid,l])=>l.forEach(s=>{ if(s.st==='pending_data') s.st=hsh(pid+'y'+s.day)<.85?'on_time':'late'; })); }); awardGoals(); } }
  else if(c==='obInvite') S.ob.invite=v; else if(c==='obWelcome') S.ob.welcome=v;
  else if(c==='pfMgr'){ S.drawer.form.perm=v?'manager':'employee'; } else if(c==='pfInvite') S.drawer.invite=v; else if(c==='impInvite') S.drawer.invite=v;
  else if(c==='cRemind') S.comp.remind=v; else if(c==='pfAnon') S.view.pulseNew.anon=v; else if(c==='gwConsec'){ S.gw.consec=v; }
  render(); });
S.ledger.filter(l=>l.kind==='redeem'&&l.status==='pending').forEach(fulfill);
render();
